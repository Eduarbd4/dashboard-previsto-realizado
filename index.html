.empty{padding:28px;color:var(--muted);text-align:center;font-size:9px}.foot{padding:16px 22px;color:#8293a1;font-size:7.5px;text-align:center}
.hidden{display:none!important}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.grid3{grid-template-columns:1fr}.heroMeta{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.shell{grid-template-columns:1fr}aside{position:relative;height:auto}.nav{grid-template-columns:1fr 1fr}.topbar{height:auto;padding:13px;align-items:flex-start;gap:12px}.content{padding:12px}.kpis{grid-template-columns:1fr 1fr}.formGrid,.catalogGrid{grid-template-columns:1fr}.formGrid .full{grid-column:auto}}

.reportNarrative{display:grid;gap:11px}
.reportTextBlock{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 15px;line-height:1.75;font-size:9.2px;color:#536b7d}

/* =========================================================
   PREMIUM FINANCIAL UI — banking-grade
   ========================================================= */
:root{
  --black:#0b0b0c;
  --charcoal:#1d1f22;
  --paper:#ffffff;
  --canvas:#f5f6f7;
  --line2:#e7e9ec;
  --muted2:#7c8289;
  --green2:#0f8a63;
  --orange2:#f28c28;
  --red2:#d74747;
  --blue3:#3a78c2;
  --purple2:#7d5bbe;
  --teal2:#2aa198;
}
body{background:var(--canvas);color:#17191c}
.shell{grid-template-columns:232px 1fr}
aside{
  background:#0b0b0c;
  border-right:1px solid #1d1d1d;
  padding:24px 14px;
}
.brand{padding:4px 10px 20px;border-bottom:1px solid #272727}
.brand strong{font-size:17px;letter-spacing:-.02em}
.brand small{color:#8d8d8d;font-size:9px}
.nav{gap:3px}
.nav button{
  color:#bdbdbd;
  padding:10px 11px;
  border-radius:7px;
  font-size:10px;
  font-weight:650
}
.nav button:hover,.nav button.active{background:#202020;color:#fff}
.nav .section{font-size:7px;color:#666;letter-spacing:.15em;padding:18px 11px 6px}
.sideBottom{border-top:1px solid #272727}
.sideBottom button{
  background:#151515;border-color:#2e2e2e;color:#d2d2d2;border-radius:7px
}
.topbar{
  height:68px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line2);
  padding:0 26px
}
.pageTitle h1{font-size:16px;letter-spacing:-.02em}
.pageTitle p{font-size:8.5px;color:#858b91}
.toolbar select,.toolbar button{
  border-color:#e0e3e6;
  border-radius:7px;
  background:#fff;
  padding:8px 10px
}
.toolbar .primary{background:#111;color:#fff;border-color:#111}
.content{padding:24px 28px 34px;max-width:1660px}

.executiveHeader{
  background:#fff;
  border:1px solid var(--line2);
  border-radius:16px;
  padding:24px 25px 22px;
  margin-bottom:14px;
}
.executiveHeaderTop{
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px
}
.executiveHeader .eyebrow{
  font-size:7px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#8a8f94;
  font-weight:800
}
.executiveHeader h2{
  margin:6px 0 5px;
  font-size:25px;
  letter-spacing:-.045em;
  color:#111
}
.executiveHeader p{
  margin:0;
  font-size:9.5px;
  line-height:1.65;
  color:#676d73;
  max-width:920px
}
.executiveStatus{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border-radius:999px;
  padding:7px 10px;
  background:#f3f4f5;
  color:#2f3337;
  font-size:8px;
  font-weight:800;
  white-space:nowrap
}
.executiveStatus:before{content:"";width:7px;height:7px;border-radius:50%;background:#111}
.execKpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  margin-top:22px;
  border-top:1px solid var(--line2)
}
.execMetric{
  padding:17px 18px 2px 0;
  border-right:1px solid var(--line2);
  cursor:pointer
}
.execMetric:not(:first-child){padding-left:18px}
.execMetric:last-child{border-right:0}
.execMetric small{
  display:block;color:#8a8f94;font-size:7px;text-transform:uppercase;letter-spacing:.08em;font-weight:800
}
.execMetric strong{
  display:block;font-size:23px;letter-spacing:-.045em;margin-top:6px;color:#111
}
.execMetric span{display:block;font-size:8px;color:#83888d;margin-top:4px}
.execMetric .up{color:var(--red2)}
.execMetric .down{color:var(--green2)}
.sourcePosition{margin-top:18px;padding-top:16px;border-top:1px solid var(--line2)}
.sourcePositionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.sourcePositionHead b{font-size:9px;color:#222}.sourcePositionHead span{font-size:7px;color:#8a8f94;text-transform:uppercase;letter-spacing:.08em}
.sourcePositionGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sourcePositionItem{background:#f7f8f8;border:1px solid #eceeef;border-radius:10px;padding:10px 11px}
.sourcePositionItem small{display:block;color:#858b91;font-size:7px;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.sourcePositionItem strong{display:block;color:#1d2124;font-size:13px;margin-top:4px}

.executiveGrid{
  display:grid;
  grid-template-columns:1.15fr .85fr .85fr;
  gap:14px;
  margin-bottom:14px
}
.executiveGrid.two{grid-template-columns:1.15fr .85fr}
.premiumCard{
  background:#fff;
  border:1px solid var(--line2);
  border-radius:15px;
  overflow:hidden
}
.premiumCardHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 17px 0
}
.premiumCardHead h3{
  margin:0;font-size:10px;color:#202327;letter-spacing:-.01em
}
.premiumCardHead small{font-size:7.5px;color:#979ca1}
.premiumCardBody{padding:12px 17px 17px}
.donutWrap{height:250px;position:relative}
.donutCenter{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none
}
.donutCenter div{text-align:center}
.donutCenter small{display:block;font-size:7px;text-transform:uppercase;color:#999;letter-spacing:.07em}
.donutCenter strong{display:block;font-size:20px;margin-top:4px;color:#111}
.miniList{display:grid;gap:9px;margin-top:8px}
.miniLine{
  display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;
  font-size:8px;color:#666
}
.miniDot{width:8px;height:8px;border-radius:50%}
.miniLine b{color:#272a2d;font-size:8px}
.miniLine strong{color:#17191c;font-size:8px}

.attentionList{display:grid;gap:0}
.attentionItem{
  display:grid;
  grid-template-columns:34px 1fr auto;
  gap:10px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #edf0f2;
  cursor:pointer
}
.attentionItem:last-child{border-bottom:0}
.attentionIndex{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:#f1f2f3;color:#333;font-size:8px;font-weight:800
}
.attentionItem b{display:block;font-size:8.5px;color:#222}
.attentionItem p{margin:3px 0 0;font-size:8px;color:#83888d;line-height:1.45}
.attentionItem strong{font-size:9px;color:#222;white-space:nowrap}

.premiumTable{overflow:auto;max-height:450px}
.premiumTable table{width:100%;border-collapse:collapse}
.premiumTable th{
  background:#fafafa;color:#92979c;font-size:7px;text-transform:uppercase;letter-spacing:.06em;
  position:sticky;top:0;z-index:2
}
.premiumTable td{font-size:8.4px}
.premiumTable tr:hover td{background:#fafbfc}

.reportExecutive{
  background:#fff;border:1px solid var(--line2);border-radius:16px;padding:23px 24px;margin-bottom:14px
}
.reportExecutive .tag{
  display:inline-block;font-size:7px;color:#777;text-transform:uppercase;letter-spacing:.14em;font-weight:800
}
.reportExecutive h2{font-size:23px;margin:6px 0;color:#111;letter-spacing:-.04em}
.reportExecutive p{font-size:9.5px;line-height:1.7;color:#666;margin:0;max-width:1050px}
.reportSection{margin:18px 0 8px}
.reportSection h3{font-size:11px;margin:0;color:#202226}
.reportSection span{font-size:7.5px;color:#959aa0}
.reportNarrative{gap:9px}
.reportTextBlock{
  border-radius:10px;
  border:1px solid #e7e9ec;
  background:#fff;
  padding:13px 14px
}
.reportTextBlock h4{font-size:9px}
.reportTextBlock p{font-size:8.8px}
.execConclusion{background:#fff;border:1px solid #e3e5e8}

@media(max-width:1200px){
  .executiveGrid,.executiveGrid.two{grid-template-columns:1fr 1fr}
}
@media(max-width:850px){
  .executiveGrid,.executiveGrid.two{grid-template-columns:1fr}
  .execKpis{grid-template-columns:1fr 1fr}
  .execMetric:nth-child(2){border-right:0}
  .sourcePositionGrid{grid-template-columns:1fr 1fr}

async function saveMonthToSupabase(forceClose=false){
  const m=$('#month').value;

  r.updatedAt=new Date().toISOString();

  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));

  if(!db){
    toast(forceClose?'Fechamento salvo localmente. ':'Competência salva localmente.');
    render();
    return;
  }
  try{
    const payload={
      competence:m,
      forecast:r.forecast||[],
      actual:r.actual||[],
      open:r.open||[],
      metadata:{
        links:r.links||{},
        openLinks:r.openLinks||{},
        settlementLinks:r.settlementLinks||{},
        officialPosition:r.officialPosition||null,
        catalog:r.catalog||{},
        auditLog:r.auditLog||[],
        closedAt:r.closedAt||null,
        status:r.closedAt?'closed':'open',
        dashboard_version:'premium-admin-v7'
      },
      updated_at:new Date().toISOString()
    };
    try{const {data:{session:active}}=await db.auth.getSession();if(active){session=active;payload.updated_by=active.user.id}}catch(e){}
    const {error}=await db.from('financial_months').upsert(payload,{onConflict:'competence'});
    if(error)throw error;
    toast(forceClose?`Fechamento de ${monthText(m)} salvo.`:`${monthText(m)} salvo.`);
    render();
  }catch(e){
    console.error(e);
    toast('Erro ao salvar. A competência permaneceu salva localmente.');
  }
}

function naPraiaProduction(r){const t=text(r),cat=norm(r.category);return /\bNA PRAIA\b/.test(t)&&(/\b(FACCAO|PRODUCAO|CONFECCAO|COSTURA|TECIDO)\b/.test(t)||cat.includes('FACCAO')||cat.includes('TECIDO'))}

function bankFee(r){const t=text(r),cat=norm(r.category);return cat.includes('TARIFA')||/\b(TAR|TARIFA|TAXA)\b.*\bPIX\b/.test(t)||/\bPIX\b.*\b(TAR|TARIFA|TAXA)\b/.test(t)||/\bTAR PIX\b/.test(t)||/\bTARIFA (BANCARIA|MANUTENCAO|AVULSA)\b/.test(t)}
function salaryAdvance(r){const t=text(r),cat=norm(r.category);if(/\b(13|DECIMO TERCEIRO)\b.*\bSALARI/.test(t))return false;if(/\b(BONUS|BONIFICACAO|LUCRO|LUCROS|FORNECEDOR|VIAGEM|COMPRA)\b/.test(t))return false;return /\bADIANTAMENT(?:O|OS)\b.*\bSALARI/.test(t)||(/\bADIANTAMENT/.test(t)&&(/\bFOPAG\b/.test(t)||cat.includes('SALARIO')))}

function fopagSalary(r){
  const t=text(r);
  if(naPraiaPayroll(r)||bankFee(r)||salaryAdvance(r)||vacation(r)||service(r)||profitAdvance(r))return false;

function managementClassification(r){
  const t=text(r),cat=norm(r.category);

  // Business meaning wins over an incorrect accounting category imported from the source.
  if(bankFee(r)) return {group:'Financeiro',sub:'Tarifas Bancárias / PIX'};
  if(naPraiaProduction(r)) return {group:'Produção e Produto',sub:'Facção / Produção NA PRAIA'};
  if(profitAdvance(r)) return {group:'Financeiro',sub:'Antecipação de Lucros'};
  if(creditCard(r)) return {group:'Financeiro',sub:'Cartão de Crédito'};

  // Benefícios (não confundir Vale Alimentação com refeição operacional)
  if(cat.includes('VALE ALIMENTACAO') || /\bCAJU\b.*\bVA\b/.test(t) || /\bVALE ALIMENTACAO\b/.test(t))
    return {group:'Pessoas e Benefícios',sub:'Vale Alimentação'};
  if(cat.includes('VALE TRANSPORTE') || /\bVALE TRANSPORTE\b/.test(t) || /\bCAJU\b.*\bVT\b/.test(t))
    return {group:'Pessoas e Benefícios',sub:'Vale Transporte'};
  if(cat.includes('PLANO DE SAUDE') || /\bWELLHUB\b|\bCONEXA\b|\bPLANO DE SAUDE\b/.test(t))
    return {group:'Pessoas e Benefícios',sub:'Saúde e Bem-estar'};

  // Alimentação operacional/reunião/viagem, separada dos benefícios
  if(/\b(IFOOD|RESTAURANTE|RESTAURANTES|LANCHONETE|ALMOCO|JANTAR|REFEICAO|PIZZA|SUSHI|PADARIA|CAFE DA MANHA|CAFETERIA)\b/.test(t))
    return {group:'Alimentação',sub:'Refeições e Alimentação'};

  if(paymentType(r)==='naPraiaPayroll') return {group:'Na Praia',sub:'Contratos Intermitentes / Semana'};
  if(paymentType(r)==='salaryAdvance') return {group:'Pessoas e FOPAG',sub:'Adiantamentos Salariais'};
  if(paymentType(r)==='vacation') return {group:'Pessoas e FOPAG',sub:'Férias'};
  if(paymentType(r)==='fopag') return {group:'Pessoas e FOPAG',sub:'Folha / Salários'};
  if(cat.includes('FGTS') || /\bFGTS\b|\bINSS\b/.test(t)) return {group:'Pessoas e FOPAG',sub:'Encargos Trabalhistas'};
  if(cat.includes('COMISSAO') || /\bCOMISSAO\b/.test(t)) return {group:'Pessoas e FOPAG',sub:'Comissões e Premiações'};

  if(cat.includes('ALUGUEL')) return {group:'Ocupação e Estrutura',sub:'Aluguel'};
  if(cat.includes('CONDOMINIO') || cat.includes('IPTU')) return {group:'Ocupação e Estrutura',sub:'Condomínio / IPTU'};
  if(cat.includes('ENERGIA')) return {group:'Ocupação e Estrutura',sub:'Energia'};
  if(cat.includes('AGUA')) return {group:'Ocupação e Estrutura',sub:'Água e Saneamento'};
  if(cat.includes('MANUTENCAO PREDIAL')) return {group:'Ocupação e Estrutura',sub:'Manutenção Predial'};

  if(cat.includes('FACCAO')) return {group:'Produção e Produto',sub:'Facção / Mão de obra'};
  if(cat.includes('TECIDO')) return {group:'Produção e Produto',sub:'Tecidos'};
  if(cat.includes('PRODUTOS PARA REVENDA')) return {group:'Produção e Produto',sub:'Produtos para Revenda'};
  if(cat.includes('ETIQUETA')) return {group:'Produção e Produto',sub:'Etiquetas e Aviamentos'};
  if(/\bAVIAMENTO\b|\bEMBALAGEM\b/.test(t)) return {group:'Produção e Produto',sub:'Aviamentos / Embalagens'};

  if(cat.includes('FRETE')) return {group:'Logística',sub:cat.includes('ENTRADA')?'Frete de Entrada':'Frete de Saída'};
  if(/\bUBER\b|\b99\b|\bTAXI\b|\bTRANSPORTE\b/.test(t)) return {group:'Logística',sub:'Transporte e Mobilidade'};

  if(cat.includes('MARKETING') || cat.includes('SOCIAL MEDIA')) return {group:'Marketing e Comercial',sub:'Marketing / Social Media'};
  if(cat.includes('VITRINE') || /\bVM\b/.test(t)) return {group:'Marketing e Comercial',sub:'Vitrine / VM'};
  if(cat.includes('PREMIAC')) return {group:'Marketing e Comercial',sub:'Premiações'};

  if(cat.includes('ICMS') || cat.includes('SIMPLES') || /\bDARF\b|\bIMPOSTO\b|\bTRIBUTO\b/.test(t)) return {group:'Tributos',sub:'Impostos e Tributos'};

  if(cat.includes('SOFTWARE') || /\bSOFTWARE\b|\bLICENCA\b|\bLINX\b/.test(t)) return {group:'Tecnologia',sub:'Software e Licenças'};
  if(cat.includes('TELEFONIA') || /\bINTERNET\b|\bTELEFONIA\b/.test(t)) return {group:'Tecnologia',sub:'Telefonia e Internet'};

  if(paymentType(r)==='service' || cat.includes('PRESTACAO DE SERVICO')) return {group:'Serviços Profissionais',sub:'Prestação de Serviços'};
  if(cat.includes('ASSESSORIA')) return {group:'Serviços Profissionais',sub:'Assessoria'};
  if(cat.includes('CONSULTORIA')) return {group:'Serviços Profissionais',sub:'Consultoria'};

  if(paymentType(r)==='bankFee' || cat.includes('TARIFA')) return {group:'Financeiro',sub:'Tarifas Bancárias'};
  if(cat.includes('EMPRESTIMO')) return {group:'Financeiro',sub:'Empréstimos'};
  if(paymentType(r)==='profitAdvance') return {group:'Financeiro',sub:'Antecipação de Lucros'};

  return {group:'Outras Despesas',sub:r.category||'Sem subcategoria'};
}
function ensureClassification(r,force=false){
  const c=managementClassification(r);
  if(bankFee(r)||naPraiaProduction(r))force=true;
  if(force || !r.managementGroup) r.managementGroup=c.group;
  if(force || !r.subcategory) r.subcategory=c.sub;
  return r;
}
function sourceIdentity(r){return [norm(r.description),norm(r.party)].join('|')}
function mergeAuthoritativeRows(reference,current){
  const pools=new Map();
  for(const old of current||[]){const key=sourceIdentity(old);if(!pools.has(key))pools.set(key,[]);pools.get(key).push(old)}
  const used=new Set();
  return (reference||[]).map(base=>{
    const next=deep(base),candidates=(pools.get(sourceIdentity(base))||[]).filter(x=>!used.has(x));
    candidates.sort((a,b)=>{
      const amountA=Math.abs(Number(a.amount||0)-Number(base.amount||0)),amountB=Math.abs(Number(b.amount||0)-Number(base.amount||0));
      const dateA=Math.abs(new Date(a.date||0)-new Date(base.date||0)),dateB=Math.abs(new Date(b.date||0)-new Date(base.date||0));
      return amountA-amountB||dateA-dateB;
    });
    const old=candidates[0];if(!old)return next;used.add(old);
    next.id=old.id;
    for(const field of ['manualType','managementGroup','subcategory'])if(old[field]!=null)next[field]=old[field];
    if(old.editedInDashboard){
      for(const field of ['party','description','category','costCenter','manualType','managementGroup','subcategory','excluded'])if(old[field]!=null)next[field]=old[field];
      next.editedInDashboard=true;
    }
    return next;
  });
}
function upgradeAugustFromAuthoritativeSources(R,m){
  if(m!=='2026-08'||!SEED[m])return;
  const source=SEED[m];
  const incomplete=(current,official)=>current.length<official.length||official.some(x=>!current.some(r=>r.id===x.id));
  if(incomplete(R.forecast,source.forecast))R.forecast=mergeAuthoritativeRows(source.forecast,R.forecast);
  if(incomplete(R.actual,source.actual))R.actual=mergeAuthoritativeRows(source.actual,R.actual);

function forcedBusinessMatch(a,forecasts){

  if(fam==='fopag'&&/\bFOPAG 07 26\b/.test(t))
    return forecastBy(forecasts,p=>businessFamily(p)==='fopag'&&/\bFOPAG JULHO 2026\b/.test(text(p)));

  if(fam==='naPraiaPayroll'){
    const list=forecasts.filter(p=>businessFamily(p)==='naPraiaPayroll');
    if(list.length){
      const ad=a.date?new Date(a.date+'T12:00:00'):null;
      return [...list].sort((x,y)=>{

    }
  }

  // Salary advances: many payments -> one forecast.
  if(fam==='salaryAdvance')

  // Profit advances must follow the person, not the imported accounting category.
  if(fam==='profitAdvance'){
    if(/\bDANIEL MOREIRA\b/.test(t))
      return forecastBy(forecasts,p=>businessFamily(p)==='profitAdvance'&&/\bDANIEL MOREIRA\b/.test(text(p)));
    if(/\bMARCELLE RESENDE\b/.test(t))
      return forecastBy(forecasts,p=>businessFamily(p)==='profitAdvance'&&/\bMARCELLE RESENDE\b/.test(text(p)));
  }

  // Card 1888 -> the R$1k card forecast; never the R$40k placeholder.
  if(fam==='creditCard')
    return forecastBy(forecasts,p=>businessFamily(p)==='creditCard'&&Number(p.amount||0)<10000);

  // Internet / telephone: store is more important than carrier.
  if(fam==='internet'){
    if(/\bFLAGSHIP\b/.test(t))
      return forecastBy(forecasts,p=>businessFamily(p)==='internet'&&/\bFLAGSHIP\b/.test(text(p)));
    const list=forecasts.filter(p=>businessFamily(p)==='internet'&&locationKey(p)===loc);
    if(list.length)return closestForecast(a,list);
  }

  // Energy and rent: center/store is the governing key.
  if(fam==='energy'){
    const list=forecasts.filter(p=>businessFamily(p)==='energy'&&locationKey(p)===loc);
    if(list.length)return closestForecast(a,list);
  }
  if(fam==='rent'){
    const list=forecasts.filter(p=>businessFamily(p)==='rent'&&locationKey(p)===loc);
    if(list.length)return closestForecast(a,list);
  }

  // Loans by contract.
  if(fam==='loan'){
    for(const key of ['PRONAMPE','FAMPE','FGI 1 5M','FGI 680K']){

    }
  }

  // Software by brand and, for LINX, by store.
  if(fam==='software'){
    for(const key of ['LINX','VNDA','ZORYA','OTO CRM','CRMBONUS','GIVER']){
      if(text(a).includes(key)){
        let list=forecasts.filter(p=>businessFamily(p)==='software'&&text(p).includes(key));

      }
    }
  }

  // FGTS by store/center; INSS is a single grouped forecast.
  if(fam==='fgts'){
    const list=forecasts.filter(p=>businessFamily(p)==='fgts'&&locationKey(p)===loc);
    if(list.length)return closestForecast(a,list);
  }
  if(fam==='inss')
    return forecastBy(forecasts,p=>businessFamily(p)==='inss');

  // Services / assessoria / consultoria by person or business-name tokens.
  if(['service','assessoria','consultoria'].includes(fam)){
    const list=forecasts.filter(p=>businessFamily(p)===fam);
    let best=null,bestScore=0;
    for(const p of list){
      const s=tokenScore(a.description,p.description)*10+
        (locationKey(a)&&locationKey(a)===locationKey(p)?1:0);
      if(s>bestScore){best=p;bestScore=s}

  if(['faccao','tecido','etiqueta','resale','frete','vitrine','marketing'].includes(fam)){
    const list=forecasts.filter(p=>businessFamily(p)===fam);
    let best=null,bestScore=0;
    for(const p of list){
      const s=tokenScore(a.description,p.description)*10+

        (Math.abs(Number(a.amount||0)-Number(p.amount||0))<.02?4:0);
      if(s>bestScore){best=p;bestScore=s}

  }

  const exact=forecasts.filter(p=>norm(p.category)===norm(a.category)&&Math.abs(Number(p.amount||0)-Number(a.amount||0))<.02);

function reconcile(){
  const r=rec(),forecasts=r.forecast.filter(x=>!isExcluded(x)),actuals=r.actual.filter(x=>!isExcluded(x)&&isPaidActual(x));
  const links={},reasons={},scores={};
  const forecastIds=new Set(forecasts.map(p=>p.id));
  const prepared=forecasts.map(p=>({p,fam:businessFamily(p),type:paymentType(p),loc:locationKey(p)}));

  for(const a of actuals){
    // A ligação escolhida no cadastro central sempre prevalece.
    if(r.links?.[a.id] && forecastIds.has(r.links[a.id])){
      links[a.id]=r.links[a.id];reasons[a.id]='Vínculo definido';scores[a.id]=100;continue;
    }

    const fam=businessFamily(a);
    if(fam==='bankFee'){
      reasons[a.id]='Tarifa bancária · não previsto confirmado';continue;
    }

    // Business rules before fuzzy matching.
    const forced=forcedBusinessMatch(a,forecasts);
    if(forced){
      links[a.id]=forced.id;
      reasons[a.id]='Vínculo financeiro validado';
      scores[a.id]=99;
      continue;
    }

    const tp=paymentType(a);

    // Grouped families.
    if(['salaryAdvance','fopag','naPraiaPayroll'].includes(tp)){
      const group=forecasts.filter(p=>paymentType(p)===tp&&isGroupedPlan(p));
      if(group.length){
        const best=closestForecast(a,group);
        links[a.id]=best.id;
        reasons[a.id]=tp==='naPraiaPayroll'?'NA PRAIA · semana correspondente':
          tp==='fopag'?'FOPAG 07/26 · folha normal':'Adiantamentos salariais';
        scores[a.id]=98;
        continue;
      }
    }

    // Exhaustive fallback inside a compatible financial family.
    let best=null,bestScore=0,secondScore=0;
    const af=fam,aloc=locationKey(a);
    for(const item of prepared){
      const p=item.p,pf=item.fam;
      if(af!=='other'&&pf!=='other'&&af!==pf)continue;
      if(af==='naPraiaPayroll'&&pf!=='naPraiaPayroll')continue;
      if(pf==='naPraiaPayroll'&&af!=='naPraiaPayroll')continue;
      if(af==='fopag'&&pf!=='fopag')continue;
      if(pf==='fopag'&&af!=='fopag')continue;

      let s=scoreMatch(a,p,tp,item.type);
      if(af===pf&&af!=='other')s+=2;
      if(aloc&&aloc===item.loc)s+=2;

      if(s>bestScore){secondScore=bestScore;best=p;bestScore=s}
      else if(s>secondScore)secondScore=s;
    }

    if(best && bestScore>=5 && (bestScore-secondScore>=.25 || bestScore>=8)){
      links[a.id]=best.id;reasons[a.id]='Conciliação automática por descrição/categoria/centro';scores[a.id]=bestScore;
    }else{
      reasons[a.id]='Não previsto confirmado / sem previsão compatível';
    }
  }

  const byForecast={};
  for(const [aid,pid] of Object.entries(links))(byForecast[pid]??=[]).push(aid);
  return {links,reasons,scores,byForecast,forecasts,actuals};
}
function computeAnalytics(){
  const R=reconcile(),f=R.forecasts,a=R.actuals;
  const fTotal=f.reduce((s,x)=>s+Number(x.amount||0),0);
  const aTotal=a.reduce((s,x)=>s+Number(x.amount||0),0);

  const linkedActualIds=new Set(Object.keys(R.links));
  // Todo pagamento efetivo entra no realizado. Se não houver previsão, inclusive tarifa bancária,
  // ele aparece como não previsto em vez de desaparecer do relatório.
  const unexpected=a.filter(x=>!linkedActualIds.has(x.id));
  const unexpectedTotal=unexpected.reduce((s,x)=>s+Number(x.amount||0),0);

  const actualById=new Map(a.map(x=>[x.id,x]));
  const planStatus=f.map(p=>{
    const ids=R.byForecast[p.id]||[];
    const actuals=ids.map(id=>actualById.get(id)).filter(Boolean);
    const paid=actuals.reduce((s,x)=>s+Number(x.amount||0),0);
    return {p,actuals,paid,remaining:Math.max(Number(p.amount||0)-paid,0),diff:Math.max(paid-Number(p.amount||0),0)};
  });

  const openSummary=openCommitmentSummary();
  // "Em aberto" vem exclusivamente do relatório de contas ainda não pagas.
  // A forecast balance is a budget variance and must never become an accounts-payable balance.
  const matchMap=new Map(openSummary.matches.map(x=>[x.open.id,x]));
  const pending=openSummary.open.map(o=>{
    const m=matchMap.get(o.id);
    return {
      ...o,
      source:'open',
      forecastId:m?.forecast?.id||null,
      forecast:m?.forecast||null,
      remaining:Number(o.amount||0),
      pendingReason:m?'Em aberto vinculado à previsão':'Em aberto sem encaixe'
    };
  });

  const pendingTotal=pending.reduce((s,x)=>s+Number(x.remaining||x.amount||0),0);
  const diff=aTotal-fTotal;

  return {
    f,a,R,planStatus,
    fTotal,aTotal,diff,
    unexpected,unexpectedTotal,
    pending,pendingTotal,
    openTotal:openSummary.total,
    openFitted:openSummary.fitted,
    openUnmatched:openSummary.unmatched,
    openMatches:openSummary.matches,
    openUnmatchedRows:openSummary.unmatched,
    o:openSummary.open
  };
}
function analytics(){
  const key=($('#month')?.value||'')+'|'+DATA_REV;

  return [1,2,3,4,5].map(w=>{
    const f=A.f.filter(r=>weekOf(r.date)===w),a=A.a.filter(r=>weekOf(analysisDate(r,A))===w),u=A.unexpected.filter(r=>weekOf(analysisDate(r,A))===w);
    return {week:w,label:'Semana '+w,forecast:f.reduce((s,x)=>s+x.amount,0),actual:a.reduce((s,x)=>s+x.amount,0),unexpected:u.reduce((s,x)=>s+x.amount,0),rows:[...f,...a]}
  })
}
function fopagData(A){
  const normalForecast=A.f.filter(r=>paymentType(r)==='fopag');
  const normalActual=A.a.filter(r=>paymentType(r)==='fopag');
  const advanceForecast=A.f.filter(r=>paymentType(r)==='salaryAdvance');
  const advanceActual=A.a.filter(r=>paymentType(r)==='salaryAdvance');
  const vacationForecast=A.f.filter(r=>paymentType(r)==='vacation');
  const vacationActual=A.a.filter(r=>paymentType(r)==='vacation');
  const serviceForecast=A.f.filter(r=>paymentType(r)==='service');
  const serviceActual=A.a.filter(r=>paymentType(r)==='service');

  // NA PRAIA MUST BE LAST AND MUST NOT be included in Folha / Salários.
  const naPraiaForecast=A.f.filter(r=>paymentType(r)==='naPraiaPayroll');
  const naPraiaActual=A.a.filter(r=>paymentType(r)==='naPraiaPayroll');

  return [
    {type:'fopag',name:'Folha / Salários',forecast:normalForecast,actual:normalActual},
    {type:'salaryAdvance',name:'Adiantamentos Salariais',forecast:advanceForecast,actual:advanceActual},
    {type:'vacation',name:'Férias',forecast:vacationForecast,actual:vacationActual},
    {type:'service',name:'Prestação de Serviços',forecast:serviceForecast,actual:serviceActual},
    {type:'naPraiaPayroll',name:'NA PRAIA · Salários e intermitentes',forecast:naPraiaForecast,actual:naPraiaActual}
  ];
}

function reportNarrative(A,cats,vendors,wk,fop){
  const exec=A.fTotal?A.aTotal/A.fTotal*100:0;
  const accuracy=A.fTotal?Math.max(0,100-Math.abs(A.diff)/A.fTotal*100):0;
  const unpct=A.aTotal?A.unexpectedTotal/A.aTotal*100:0;
  const projectedTotal=A.aTotal+A.pendingTotal;
  const projectedVariance=projectedTotal-A.fTotal;
  const topOver=[...cats].filter(x=>x.diff>0).sort((a,b)=>b.diff-a.diff);
  const topUnder=[...cats].filter(x=>x.diff<0).sort((a,b)=>a.diff-b.diff);
  const spendGroups=groupRows(A);
  const largestGroup=spendGroups[0];
  const top5pct=0;
  const worstWeek=[...wk].sort((a,b)=>(b.actual-b.forecast)-(a.actual-a.forecast))[0];

  const fopagForecast=fop.reduce((s,b)=>s+b.forecast.reduce((t,x)=>t+x.amount,0),0);
  const fopagActual=fop.reduce((s,b)=>s+b.actual.reduce((t,x)=>t+x.amount,0),0);
  const fopagDiff=fopagActual-fopagForecast;

  let budgetText='';
  if(A.diff>0){
    budgetText=`<strong>Leitura:</strong> os pagamentos já somam <strong>${money(A.aTotal)}</strong>, ou <strong>${pct(exec)}</strong> do orçamento de <strong>${money(A.fTotal)}</strong>. O orçamento foi superado em <strong>${money(A.diff)}</strong>.`;
    if(topOver.length){
      budgetText+=` A maior pressão está em <strong>${esc(topOver[0].name)}</strong>, com <strong>${money(topOver[0].diff)}</strong> acima do planejado.`;
    }
    if(A.pendingTotal>0)budgetText+=` Se todas as contas em aberto forem quitadas, a saída total chegará a <strong>${money(projectedTotal)}</strong>, ficando <strong>${money(Math.abs(projectedVariance))}</strong> acima do previsto.`;
  }else{
    budgetText=`<strong>Leitura:</strong> foram pagos <strong>${money(A.aTotal)}</strong> de um orçamento de <strong>${money(A.fTotal)}</strong>, equivalente a <strong>${pct(exec)}</strong> de execução. O saldo orçamentário atual é favorável em <strong>${money(Math.abs(A.diff))}</strong>.`;
    if(A.pendingTotal>0){
      budgetText+=` Ainda existem <strong>${money(A.pendingTotal)}</strong> em contas em aberto. Se todas forem pagas, a saída total chegará a <strong>${money(projectedTotal)}</strong> e ficará <strong>${money(Math.abs(projectedVariance))}</strong> ${projectedVariance<=0?'abaixo':'acima'} do previsto.`;
    }
  }

  const predictText = A.unexpectedTotal>0
    ? `<strong>Leitura:</strong> existem <strong>${A.unexpected.length} pagamentos sem previsão vinculada</strong>, somando <strong>${money(A.unexpectedTotal)}</strong> — <strong>${pct(unpct)}</strong> de tudo o que foi pago. Esses lançamentos aparecem separados para facilitar a conferência.`
    : `<strong>Leitura:</strong> todos os pagamentos do período possuem previsão vinculada. Isso indica boa aderência entre planejamento e execução do caixa.`;

  const pendingText = A.pendingTotal>0
    ? `<strong>Impacto no caixa:</strong> há <strong>${A.pending.length} contas ainda não pagas</strong>, totalizando <strong>${money(A.pendingTotal)}</strong>. Se todas forem quitadas, o desembolso acumulado passará de <strong>${money(A.aTotal)}</strong> para <strong>${money(projectedTotal)}</strong>. Esses valores ainda não fazem parte do total pago.`
    : `<strong>Leitura:</strong> não há contas ativas em aberto no período. O saldo disponível no orçamento não é tratado como obrigação a pagar.`;

  const supplierText = largestGroup
    ? `<strong>${esc(largestGroup.name)}</strong> é o maior grupo de desembolso do período, com <strong>${money(largestGroup.actual)}</strong>, equivalente a <strong>${pct(A.aTotal?largestGroup.actual/A.aTotal*100:0)}</strong> do total pago. Essa participação mostra o peso do grupo na composição financeira do mês.`
    : `Não há pagamentos suficientes para avaliar a composição dos desembolsos neste período.`;

  const fopagText = `<strong>Posição da FOPAG:</strong> <strong>${money(fopagForecast)}</strong> previstos e <strong>${money(fopagActual)}</strong> pagos. O realizado está <strong>${money(Math.abs(fopagDiff))}</strong> ${fopagDiff>0?'acima':'abaixo'} do previsto. Folha, adiantamentos, férias, serviços e salários do NA PRAIA permanecem demonstrados separadamente para facilitar a conferência.`;

  const weeklyDiff=worstWeek?worstWeek.actual-worstWeek.forecast:0;
  const weeklyText = worstWeek
    ? weeklyDiff>0
      ? `<strong>${esc(worstWeek.label)}</strong> apresentou a maior concentração de caixa: o pago superou o previsto em <strong>${money(weeklyDiff)}</strong>. Esse resultado reúne os pagamentos vinculados às previsões da semana.`
      : `Nenhuma semana superou o orçamento. A <strong>${esc(worstWeek.label)}</strong> foi a que mais se aproximou do valor previsto, permanecendo <strong>${money(Math.abs(weeklyDiff))}</strong> abaixo.`
    : `Não há dados suficientes para identificar uma semana de maior pressão de caixa.`;

  const conclusion = [];
  if(A.diff>0) conclusion.push(`O total pago está ${money(A.diff)} acima do orçamento; ${topOver[0]?.name||'a principal categoria'} concentra o maior desvio.`);
  else conclusion.push(`O total pago está ${money(Math.abs(A.diff))} abaixo do orçamento atual.`);
  if(A.pending.length) conclusion.push(`Com a quitação de todas as contas em aberto, o desembolso acumulado chegaria a ${money(projectedTotal)}.`);
  if(A.unexpected.length) conclusion.push(`${A.unexpected.length} pagamentos permanecem sem previsão vinculada, somando ${money(A.unexpectedTotal)}.`);
  if(largestGroup) conclusion.push(`${largestGroup.name} é o maior grupo de desembolso e representa ${pct(A.aTotal?largestGroup.actual/A.aTotal*100:0)} do total pago.`);
  conclusion.push(`A FOPAG permanece demonstrada separadamente por salários, adiantamentos, férias e serviços.`);
  if(accuracy<90) conclusion.push(`A aderência atual entre orçamento e execução é de ${pct(accuracy)}.`);

  return {budgetText,predictText,pendingText,supplierText,fopagText,weeklyText,conclusion,accuracy,exec,unpct,topOver,topUnder,top5pct};
}

function updateInlineSelection(block){
  if(!block)return;
  const ids=[...block.querySelectorAll('.rowSelect:checked')].map(x=>x.dataset.select);
  const data=rows().filter(r=>ids.includes(r.id));
  const total=data.reduce((s,r)=>s+Number(r.amount||0),0);
  const count=block.querySelector('.inlineSelectionCount');
  const value=block.querySelector('.inlineSelectionValue');
  if(count)count.textContent=`${data.length} lançamento${data.length===1?'':'s'}`;
  if(value)value.textContent=money(total);
  block.classList.toggle('hasSelection',data.length>0);
}
function setSelectionFromBlock(block){
  selectedRows.clear();
  [...block.querySelectorAll('.rowSelect:checked')].forEach(x=>selectedRows.add(x.dataset.select));
}

function bindSelectionControls(){
  document.querySelectorAll('.tableBlock').forEach(block=>updateInlineSelection(block));

  document.querySelectorAll('.rowSelect').forEach(cb=>{
    cb.onclick=e=>{
      e.stopPropagation();
      const block=cb.closest('.tableBlock');
      if(cb.checked)selectedRows.add(cb.dataset.select);else selectedRows.delete(cb.dataset.select);
      cb.closest('tr')?.classList.toggle('selectedRow',cb.checked);
      updateInlineSelection(block);
    };
  });

  document.querySelectorAll('.checkAllVisible').forEach(master=>{
    master.onclick=e=>{
      e.stopPropagation();
      const block=master.closest('.tableBlock');
      const boxes=block?[...block.querySelectorAll('.rowSelect')]:[];
      boxes.forEach(cb=>{
        cb.checked=master.checked;
        if(master.checked)selectedRows.add(cb.dataset.select);else selectedRows.delete(cb.dataset.select);
        cb.closest('tr')?.classList.toggle('selectedRow',master.checked);
      });
      updateInlineSelection(block);
    };
  });

  document.querySelectorAll('.inlineBulkEdit').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();const block=btn.closest('.tableBlock');setSelectionFromBlock(block);
    if(!selectedRows.size)return toast('Selecione lançamentos nesta tabela.');
    openBulkEdit();
  });
  document.querySelectorAll('.inlineLink').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();const block=btn.closest('.tableBlock');setSelectionFromBlock(block);
    if(!selectedRows.size)return toast('Selecione pagamentos nesta tabela.');
    openBulkLink();
  });
  document.querySelectorAll('.inlineClear').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();const block=btn.closest('.tableBlock');
    block.querySelectorAll('.rowSelect').forEach(cb=>{selectedRows.delete(cb.dataset.select);cb.checked=false;cb.closest('tr')?.classList.remove('selectedRow')});
    const master=block.querySelector('.checkAllVisible');if(master)master.checked=false;
    updateInlineSelection(block);
  });

  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();openRow(btn.dataset.edit)};
  });
}

  $('#rulesEditForecast')?.addEventListener('click',()=>openEditableList('forecast'));
  $('#rulesEditActual')?.addEventListener('click',()=>openEditableList('actual'));
  $('#rulesCatalog')?.addEventListener('click',openCatalog);
  $('#rulesReclassify')?.addEventListener('click',()=>{
    pushUndo('reclassificar lançamentos');
    rows().forEach(r=>ensureClassification(r,true));
    audit('Reclassificação','Grupo gerencial e subcategoria recalculados.');
    saveState('Lançamentos reclassificados.');
  });

  bindSelectionControls();
}

  if(!state[month])return null;
  select.value=month;
  const A=analytics();
  select.value=previous;
  return A;
}
function monthOptions(selected){
  const months=Object.keys(state).filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
  return months.map(m=>`<option value="${m}" ${m===selected?'selected':''}>${esc(monthText(m))}</option>`).join('');
}
function categoryComparison(m1,m2){
  const A1=analyticsForMonth(m1),A2=analyticsForMonth(m2);
  if(!A1||!A2)return[];
  const c1=byCategory(A1),c2=byCategory(A2),names=[...new Set([...c1.map(x=>x.name),...c2.map(x=>x.name)])];
  return names.map(name=>{
    const a=c1.find(x=>x.name===name)||{forecast:0,actual:0};
    const b=c2.find(x=>x.name===name)||{forecast:0,actual:0};
    return {name,p1:a.forecast,r1:a.actual,p2:b.forecast,r2:b.actual,change:b.actual-a.actual};
  }).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));
}

function openComparisonCategory(category,m1,m2){
  const A1=analyticsForMonth(m1),A2=analyticsForMonth(m2);
  const r1=[...A1.f,...A1.a].filter(r=>norm(r.category)===norm(category));
  const r2=[...A2.f,...A2.a].filter(r=>norm(r.category)===norm(category));
  [...r1,...r2].forEach(r=>ensureClassification(r));

function openMatchScore(o,p){
  const ot=paymentType(o),pt=paymentType(p);
  if(ot==='naPraiaPayroll'&&pt!=='naPraiaPayroll')return -999;
  if(pt==='naPraiaPayroll'&&ot!=='naPraiaPayroll')return -999;
  if(ot==='fopag'&&pt!=='fopag')return -999;
  if(pt==='fopag'&&ot!=='fopag')return -999;

  let score=0;
  if(norm(o.category)&&norm(o.category)===norm(p.category))score+=4;
  if(norm(o.costCenter)&&norm(o.costCenter)===norm(p.costCenter))score+=2;
  if(norm(o.party)&&norm(o.party)!=='NAO INFORMADO'&&norm(o.party)===norm(p.party))score+=3;
  score+=tokenScore(o.description,p.description)*5;

  const oa=Math.abs(Number(o.amount)||0),pa=Math.abs(Number(p.amount)||0);
  if(oa&&pa){
    const ratio=Math.abs(oa-pa)/Math.max(oa,pa);
    if(ratio<=.01)score+=3;
    else if(ratio<=.05)score+=2;
    else if(ratio<=.15)score+=1;
  }
  return score;
}
function reconcileOpen(){
  const r=rec(),plans=r.forecast.filter(x=>!isExcluded(x)),opens=(r.open||[]).filter(x=>!isExcluded(x)&&!r.settlementLinks?.[x.id]);
  const matches=[],unmatched=[];
  r.openLinks=r.openLinks||{};

  for(const o of opens){
    let p=null,score=0,manual=false;
    const manualId=r.openLinks[o.id];
    if(manualId){
      p=plans.find(x=>x.id===manualId)||null;
      if(p){score=100;manual=true}
    }
    if(!p){
      const ranked=plans.map(candidate=>({candidate,s:openMatchScore(o,candidate)}))
        .filter(x=>x.s>-900).sort((a,b)=>b.s-a.s);
      const best=ranked[0],second=ranked[1];
      if(best){
        const sameCategory=norm(o.category)===norm(best.candidate.category);
        const sameCC=norm(o.costCenter)===norm(best.candidate.costCenter);
        const clear=!second||best.s-second.s>=.35;
        if(best.s>=4 && (sameCategory||sameCC||best.s>=6) && clear){
          p=best.candidate;score=best.s;
        }
      }
    }
    if(p)matches.push({open:o,forecast:p,score,manual});
    else unmatched.push(o);
  }
  return {matches,unmatched};
}
function openCommitmentSummary(){
  const r=rec(),all=(r.open||[]).filter(x=>!x.excluded),actualById=new Map((r.actual||[]).map(x=>[x.id,x]));
  const settled=all.map(o=>({open:o,actual:actualById.get(r.settlementLinks?.[o.id]),forecast:(r.forecast||[]).find(p=>p.id===r.openLinks?.[o.id])||null})).filter(x=>x.actual);
  const open=all.filter(x=>!r.settlementLinks?.[x.id]||!actualById.has(r.settlementLinks[x.id]));
  const reconciled=reconcileOpen();
  const total=open.reduce((s,x)=>s+Number(x.amount||0),0);
  const fitted=reconciled.matches.reduce((s,x)=>s+Number(x.open.amount||0),0);
  const unmatched=reconciled.unmatched.reduce((s,x)=>s+Number(x.amount||0),0);
  return {open,total,fitted,unmatched,settled,settledTotal:settled.reduce((s,x)=>s+Number(x.actual.amount||0),0),...reconciled};
}
function autoSettleOpenForRecord(r){
  r.openLinks??={};r.settlementLinks??={};r.links??={};
  const usedActual=new Set(Object.values(r.settlementLinks));
  for(const open of (r.open||[]).filter(x=>!x.excluded&&!r.settlementLinks[x.id])){
    const openDue=open.dueDate||open.date;
    const candidates=(r.actual||[]).filter(a=>!usedActual.has(a.id)&&isPaidActual(a)).map(actual=>{
      const actualDue=actual.dueDate||actual.date;
      const sameDescription=norm(actual.description)===norm(open.description);
      const sameAmount=Math.abs(Number(actual.amount||0)-Number(open.amount||0))<.02;
      const sameDue=actualDue===openDue;
      const sameParty=norm(open.party)!=='NAO INFORMADO'&&norm(actual.party)===norm(open.party);
      const sameCategory=norm(actual.category)===norm(open.category);
      const score=(sameDescription?8:tokenScore(open.description,actual.description)*4)+(sameAmount?5:0)+(sameDue?6:0)+(sameParty?2:0)+(sameCategory?1:0);
      return {actual,score,sameDescription,sameAmount,sameDue};
    }).filter(x=>x.sameDescription&&x.sameAmount&&x.sameDue).sort((a,b)=>b.score-a.score);
    if(!candidates[0])continue;
    const actual=candidates[0].actual;usedActual.add(actual.id);
    if(!r.openLinks[open.id]){
      const forecast=[...(r.forecast||[])].filter(x=>!isExcluded(x)).map(p=>({p,score:openMatchScore(open,p)})).sort((a,b)=>b.score-a.score)[0];
      if(forecast?.score>=4)r.openLinks[open.id]=forecast.p.id;
    }
    if(r.openLinks[open.id])r.links[actual.id]=r.openLinks[open.id];
    open.statusBeforeSettlement=open.status||'Em aberto';open.status='Quitado';open.paidAmount=Number(actual.amount||0);open.settledAt=actual.date;
    r.settlementLinks[open.id]=actual.id;
  }
}
function setFinancialChain(openId,forecastId='',actualId=''){
  const r=rec(),open=r.open.find(x=>x.id===openId),forecast=r.forecast.find(x=>x.id===forecastId)||null,actual=r.actual.find(x=>x.id===actualId)||null;
  if(!open)throw new Error('Selecione uma conta em aberto válida.');
  r.openLinks??={};r.settlementLinks??={};r.links??={};
  const previousActualId=r.settlementLinks[openId]||'';
  const previousForecastId=r.openLinks[openId]||'';
  if(forecast)r.openLinks[openId]=forecast.id;else delete r.openLinks[openId];
  if(actual){
    for(const [otherOpen,otherActual] of Object.entries(r.settlementLinks)){
      if(otherOpen!==openId&&otherActual===actual.id){
        const other=r.open.find(x=>x.id===otherOpen);if(other){other.status=other.statusBeforeSettlement||'Em aberto';delete other.statusBeforeSettlement;delete other.paidAmount;delete other.settledAt}
        delete r.settlementLinks[otherOpen];
      }
    }
    if(!open.statusBeforeSettlement)open.statusBeforeSettlement=open.status||'Em aberto';
    r.settlementLinks[openId]=actual.id;open.status='Quitado';open.paidAmount=Number(actual.amount||0);open.settledAt=actual.date||new Date().toISOString().slice(0,10);
    if(forecast)r.links[actual.id]=forecast.id;
  }else{
    delete r.settlementLinks[openId];open.status=open.statusBeforeSettlement||(/\bQUITADO\b/.test(norm(open.status))?'Em aberto':open.status);delete open.statusBeforeSettlement;delete open.paidAmount;delete open.settledAt;
    if(previousActualId&&r.links[previousActualId]===previousForecastId)delete r.links[previousActualId];
  }
  return {open,forecast,actual};
}
function removeFinancialReferences(id){
  const r=rec();delete r.links?.[id];delete r.openLinks?.[id];delete r.settlementLinks?.[id];
  for(const [aid,pid] of Object.entries(r.links||{}))if(pid===id)delete r.links[aid];
  for(const [oid,pid] of Object.entries(r.openLinks||{}))if(pid===id)delete r.openLinks[oid];
  for(const [oid,aid] of Object.entries(r.settlementLinks||{}))if(aid===id){const o=r.open.find(x=>x.id===oid);if(o){o.status=o.statusBeforeSettlement||'Em aberto';delete o.statusBeforeSettlement;delete o.paidAmount;delete o.settledAt}delete r.settlementLinks[oid]}
}

function basicCols(){return[
 {label:'Data',render:r=>dateText(r.date)},
 {label:'Fornecedor / colaborador',render:r=>esc(r.party)},
 {label:'Descrição',render:r=>esc(r.description)},

 {label:'Centro de custo',render:r=>esc(r.costCenter)},
 {label:'Valor',num:true,render:r=>`<b>${money(r.amount)}</b>`}
]}
function filteredRows(A){
 const q=norm($('#fq')?.value||''),src=$('#fs')?.value||'all',cat=$('#fc')?.value||'all',grp=$('#fg')?.value||'all';
 return [...A.f,...A.a,...(rec().open||[])].filter(r=>{
   ensureClassification(r);
   const search=norm([r.party,r.description,r.category,r.managementGroup,r.subcategory,r.costCenter].join(' '));
   return (src==='all'||r.source===src)&&(cat==='all'||r.category===cat)&&(grp==='all'||r.managementGroup===grp)&&(!q||search.includes(q));
 }).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function filtersHTML(){
 const cats=[...new Set(rows().map(r=>r.category).filter(Boolean))].sort();
 const groups=[...new Set(rows().map(r=>{ensureClassification(r);return r.managementGroup}).filter(Boolean))].sort();
 return `<div class="filterbar noPrint"><input id="fq" placeholder="Buscar fornecedor, descrição, categoria, subcategoria..."><select id="fs"><option value="all">Previsto + pago + em aberto</option><option value="forecast">Somente previsto</option><option value="actual">Somente pago</option><option value="open">Somente em aberto</option></select><select id="fg"><option value="all">Todos os grupos</option>${groups.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="fc"><option value="all">Todas as categorias</option>${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button id="applyFilters">Aplicar</button><button id="clearFilters">Limpar</button></div>`;

function aggregateBy(list,keyFn){
  const m={};
  for(const r of list){
    ensureClassification(r);
    const k=keyFn(r)||'Não informado';
    m[k]??={name:k,forecast:0,actual:0,count:0,rows:[]};
    if(r.source==='forecast')m[k].forecast+=r.amount;else m[k].actual+=r.amount;
    m[k].count++;m[k].rows.push(r);
  }
  return Object.values(m).map(x=>({...x,diff:x.actual-x.forecast})).sort((a,b)=>Math.max(b.actual,b.forecast)-Math.max(a.actual,a.forecast));
}

function emptyMonthRecord(){

function normalizeMonthRecord(r){
  r=r||{};
  r.forecast=Array.isArray(r.forecast)?r.forecast:[];
  r.actual=Array.isArray(r.actual)?r.actual:[];
  r.open=Array.isArray(r.open)?r.open:[];
  r.links=r.links||{};
  r.openLinks=r.openLinks||{};
  r.settlementLinks=r.settlementLinks||{};
  r.officialPosition=r.officialPosition||null;
  r.catalog=r.catalog||{categories:[],costCenters:[]};
  r.catalog.categories=Array.isArray(r.catalog.categories)?r.catalog.categories:[];
  r.catalog.costCenters=Array.isArray(r.catalog.costCenters)?r.catalog.costCenters:[];
  r.auditLog=Array.isArray(r.auditLog)?r.auditLog:[];
  r.updatedAt=r.updatedAt||null;
  r.closedAt=r.closedAt||null;
  return r;
}

async function loadHistoricalMonthsFromSupabase(){
  if(!db)return;
  try{
    const {data,error}=await db.from('financial_months').select('competence,forecast,actual,open,metadata,updated_at').order('competence',{ascending:false});
    if(error)throw error;
    if(!Array.isArray(data))return;
    let changed=false;
    for(const row of data){
      const m=String(row.competence||'').slice(0,7);
      if(!/^\d{4}-\d{2}$/.test(m))continue;
      {
        const meta=row.metadata||{};
        const local=state[m];
        const remoteUpdated=row.updated_at?new Date(row.updated_at).getTime():0;
        const localUpdated=local?.updatedAt?new Date(local.updatedAt).getTime():0;
        if(!local || remoteUpdated>=localUpdated)state[m]=normalizeMonthRecord({
          forecast:row.forecast||[],
          actual:row.actual||[],
          open:row.open||[],
          links:meta.links||{},
          openLinks:meta.openLinks||{},
          settlementLinks:meta.settlementLinks||{},
          officialPosition:meta.officialPosition||null,
          catalog:meta.catalog||{categories:[],costCenters:[]},
          auditLog:meta.auditLog||[],
          updatedAt:row.updated_at||null,
          closedAt:meta.closedAt||null
        });
        changed=true;
      }
    }
    if(changed){
      migrateState();
      invalidateAnalytics();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      populateMonths($('#month')?.value);
      render();
    }
  }catch(e){console.warn('Histórico Supabase:',e)}
}

function seedAuthoritativeOpenAugust(){
  if(!AUTHORITATIVE_OPEN_2026_08?.length)return;
  const m='2026-08';
  state[m]=normalizeMonthRecord(state[m]||emptyMonthRecord());
  // Only seed when no open report exists yet; user imports can replace it later.
  if(!state[m].open.length){
    state[m].open=AUTHORITATIVE_OPEN_2026_08.map(x=>{
      const r={...x};
      if(/\bMANE MERCADO\b/.test(norm(r.description)))r.costCenter='Mané Mercado';

function importMatchKey(r){return [r.source,norm(r.party),norm(r.description)].join('|')}
function preserveImportedIdentity(list,previous){
  const queues=new Map();
  for(const old of previous||[]){const k=importMatchKey(old);if(!queues.has(k))queues.set(k,[]);queues.get(k).push(old)}
  for(const next of list){
    const old=queues.get(importMatchKey(next))?.shift();if(!old)continue;
    next.id=old.id;
    for(const field of ['manualType','managementGroup','subcategory'])if(old[field]!=null)next[field]=old[field];
    if(next.source==='actual'&&next.dateSource==='due'&&old.date)next.date=old.date;
    if(old.editedInDashboard){
      for(const field of ['party','description','category','costCenter','managementGroup','subcategory','manualType','excluded'])if(old[field]!=null)next[field]=old[field];
      next.editedInDashboard=true;
    }
  }
}
function workbookDate(rawDate){
  if(rawDate instanceof Date&&!isNaN(rawDate))return `${rawDate.getFullYear()}-${String(rawDate.getMonth()+1).padStart(2,'0')}-${String(rawDate.getDate()).padStart(2,'0')}`;
  if(typeof rawDate==='number'){const d=XLSX.SSF.parse_date_code(rawDate);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:''}
  const m=String(rawDate||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:String(rawDate||'').slice(0,10);
}
function refreshOfficialPosition(r,m){
  const today=new Date().toISOString().slice(0,10),open=(r.open||[]).filter(x=>!x.excluded&&!r.settlementLinks?.[x.id]);
  const paid=(r.actual||[]).filter(isPaidActual).reduce((s,x)=>s+Number(x.amount||0),0);
  let overdue=0,dueToday=0,toDue=0;
  for(const x of open){const amount=Number(x.amount||0);if(x.date<today)overdue+=amount;else if(x.date===today)dueToday+=amount;else toDue+=amount}
  r.officialPosition={paid,overdue,dueToday,toDue,total:paid+overdue+dueToday+toDue,paidRows:(r.actual||[]).filter(isPaidActual).length,openRows:open.length,source:'Relatório financeiro',asOf:today};
}
async function importWorkbook(file,source){
 const data=await file.arrayBuffer(),wb=XLSX.read(data),sheet=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(sheet,{defval:''});
 const out=[];
 for(let i=0;i<raw.length;i++){
  const o=raw[i],pick=(names)=>{for(const n of names){const k=Object.keys(o).find(k=>norm(k)===norm(n));if(k)return o[k]}return''};
  const principal=num(pick(['Valor original da parcela (R$)','Valor original','Valor previsto','Valor']));
  const paidPrincipal=num(pick(['Valor pago da parcela (R$)','Valor pago','Valor realizado']));
  const paidTotal=num(pick(['Valor total pago da parcela (R$)','Valor total pago']));
  const openPrincipal=num(pick(['Valor da parcela em aberto (R$)','Valor em aberto']));
  const openTotal=num(pick(['Valor total da parcela em aberto (R$)','Valor total em aberto']));
  let amount=source==='forecast'?principal:source==='open'?(openTotal||openPrincipal||principal):(paidTotal||paidPrincipal);
  const status=String(pick(['Situação','Status']));
  if(source==='actual' && (amount<=0||!/\b(QUITADO|PAGO|LIQUIDADO|BAIXADO|CONCILIADO)\b/.test(norm(status))))continue;
  if(source==='open' && (/\b(QUITADO|PAGO|LIQUIDADO|BAIXADO|CONCILIADO)\b/.test(norm(status))||amount<=0))continue;
  if(amount<=0)continue;
  const paymentDate=source==='actual'?pick(['Data do último pagamento','Data de pagamento']):'';
  const dueDate=pick(['Data prevista','Data de vencimento','Data de competência']);
  const date=workbookDate(paymentDate||dueDate);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;
  const category=String(pick(source==='forecast'?['Categoria ','Categoria','Categoria 1']:['Categoria 1','Categoria','Plano de contas']))||'Sem categoria';
  let costCenter=String(pick(source==='forecast'?['Centro de Custo ','Centro de Custo','Centro de Custo 1']:['Centro de Custo 1','Centro de Custo','Centro de custo']))||'Não informado';
  const description=String(pick(['Descrição','Descricao','Histórico','Historico','Observação']))||'Sem descrição';
  if(source==='open'&&/\bMANE MERCADO\b/.test(norm(description)))costCenter='Mané Mercado';
  if(source==='open'&&/\bPARKSHOPPING\b|\bPARK SHOPPING\b/.test(norm(description)))costCenter='Park Shopping';
  const rr={id:uid(source==='forecast'?'F':source==='open'?'O':'A'),source,date,dueDate:workbookDate(dueDate),dateSource:source==='actual'&&!paymentDate?'due':'payment',party:String(pick(['Nome do fornecedor','Fornecedor','Fornecedor / Cliente','Pessoa']))||'Não informado',description,amount,principalAmount:principal,paidAmount:paidPrincipal,totalPaidAmount:paidTotal,openAmount:openTotal||openPrincipal,interestAmount:num(pick(['Juros realizado (R$)'])),fineAmount:num(pick(['Multa realizado (R$)'])),discountAmount:num(pick(['Desconto realizado (R$)'])),category,costCenter,status:source==='forecast'?'Previsto':status,paymentMethod:String(pick(['Forma de pagamento']))||'',bank:String(pick(['Conta bancária']))||'',excluded:false,manualType:'automatic',createdBy:file.name};ensureClassification(rr,false);out.push(rr)
 }
 const grouped={};out.forEach(r=>{const m=r.date.slice(0,7);if(/^\d{4}-\d{2}$/.test(m))(grouped[m]??=[]).push(r)});
 const importedMonths=Object.keys(grouped).sort();
 if(!importedMonths.length){toast('Nenhuma competência válida encontrada no arquivo.');return;}
 pushUndo(source==='forecast'?'importar previsão mensal':source==='open'?'importar contas em aberto':'importar pagamentos mensais');
 for(const [m,list] of Object.entries(grouped)){
   state[m]=normalizeMonthRecord(state[m]);
   const field=sourceField(source);
   const previous=state[m][field]||[];
   preserveImportedIdentity(list,previous);
   if(source==='open'){
     const importedIds=new Set(list.map(x=>x.id));
     for(const old of previous)if(state[m].settlementLinks?.[old.id]&&!importedIds.has(old.id))list.push(old);
   }
   state[m][field]=list;
   state[m].updatedAt=new Date().toISOString();
   if(source==='actual'){
     const validIds=new Set(list.map(x=>x.id));
     const kept={};
     for(const [aid,pid] of Object.entries(state[m].links||{}))if(validIds.has(aid))kept[aid]=pid;
     state[m].links=kept;
   }
   if(source==='open'){
     const validIds=new Set(list.map(x=>x.id));
     const kept={};
     for(const [oid,pid] of Object.entries(state[m].openLinks||{}))if(validIds.has(oid))kept[oid]=pid;
     state[m].openLinks=kept;
     const settled={};
     for(const [oid,aid] of Object.entries(state[m].settlementLinks||{}))if(validIds.has(oid)&&state[m].actual.some(a=>a.id===aid))settled[oid]=aid;
     state[m].settlementLinks=settled;
   }
   autoSettleOpenForRecord(state[m]);
   refreshOfficialPosition(state[m],m);
   if(source==='actual'){
     const actualIds=new Set(list.map(x=>x.id)),settled={};
     for(const [oid,aid] of Object.entries(state[m].settlementLinks||{}))if(actualIds.has(aid)&&state[m].open.some(o=>o.id===oid))settled[oid]=aid;
     state[m].settlementLinks=settled;
   }
   state[m].auditLog??=[];
   state[m].auditLog.unshift({at:new Date().toISOString(),action:'Importação mensal',details:`${source==='forecast'?'Previsão':source==='open'?'Contas em aberto':'Pagamentos'} importados em ${m} sem apagar outras competências.`});
 }
 invalidateAnalytics();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
 const targetMonth=importedMonths[importedMonths.length-1];
 populateMonths(targetMonth);$('#month').value=targetMonth;selectedRows.clear();render();
 toast(`${source==='forecast'?'Previsão':source==='open'?'Contas em aberto':'Pagamentos'} de ${monthText(targetMonth)} importados. Meses anteriores preservados.`);
 if(db){try{const {data:{session:active}}=await db.auth.getSession();if(active){session=active;await saveAllMonthsToSupabase()}}catch(e){console.warn('Sincronização após importação:',e)}}
}

$('#month').onchange=()=>{selectedRows.clear();render()};$('#closeModal').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};
