/* =========================================================
   PREMIUM FINANCIAL UI — banking-grade
   ========================================================= */
:root{
  --black:#0b0b0c;
  --charcoal:#1d1f22;
  --paper:#ffffff;
  --canvas:#f5f6f7;
  --line2:#e7e9ec;
  --muted2:#7c8289;
  --green2:#0f8a63;
  --orange2:#f28c28;
  --red2:#d74747;
  --blue3:#3a78c2;
  --purple2:#7d5bbe;
  --teal2:#2aa198;
}
body{background:var(--canvas);color:#17191c}
.shell{grid-template-columns:232px 1fr}
aside{
  background:#0b0b0c;
  border-right:1px solid #1d1d1d;
  padding:24px 14px;
}
.brand{padding:4px 10px 20px;border-bottom:1px solid #272727}
.brand strong{font-size:17px;letter-spacing:-.02em}
.brand small{color:#8d8d8d;font-size:9px}
.nav{gap:3px}
.nav button{
  color:#bdbdbd;
  padding:10px 11px;
  border-radius:7px;
  font-size:10px;
  font-weight:650
}
.nav button:hover,.nav button.active{background:#202020;color:#fff}
.nav .section{font-size:7px;color:#666;letter-spacing:.15em;padding:18px 11px 6px}
.sideBottom{border-top:1px solid #272727}
.sideBottom button{
  background:#151515;border-color:#2e2e2e;color:#d2d2d2;border-radius:7px
}
.topbar{
  height:68px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line2);
  padding:0 26px
}
.pageTitle h1{font-size:16px;letter-spacing:-.02em}
.pageTitle p{font-size:8.5px;color:#858b91}
.toolbar select,.toolbar button{
  border-color:#e0e3e6;
  border-radius:7px;
  background:#fff;
  padding:8px 10px
}
.toolbar .primary{background:#111;color:#fff;border-color:#111}
.content{padding:24px 28px 34px;max-width:1660px}

.executiveHeader{
  background:#fff;
  border:1px solid var(--line2);
  border-radius:16px;
  padding:24px 25px 22px;
  margin-bottom:14px;
}
.executiveHeaderTop{
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px
}
.executiveHeader .eyebrow{
  font-size:7px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#8a8f94;
  font-weight:800
}
.executiveHeader h2{
  margin:6px 0 5px;
  font-size:25px;
  letter-spacing:-.045em;
  color:#111
}
.executiveHeader p{
  margin:0;
  font-size:9.5px;
  line-height:1.65;
  color:#676d73;
  max-width:920px
}
.executiveStatus{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border-radius:999px;
  padding:7px 10px;
  background:#f3f4f5;
  color:#2f3337;
  font-size:8px;
  font-weight:800;
  white-space:nowrap
}
.executiveStatus:before{content:"";width:7px;height:7px;border-radius:50%;background:#111}
.execKpis{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  margin-top:22px;
  border-top:1px solid var(--line2)
}
.execMetric{
  padding:17px 18px 2px 0;
  border-right:1px solid var(--line2);
  cursor:pointer
}
.execMetric:not(:first-child){padding-left:18px}
.execMetric:last-child{border-right:0}
.execMetric small{
  display:block;color:#8a8f94;font-size:7px;text-transform:uppercase;letter-spacing:.08em;font-weight:800
}
.execMetric strong{
  display:block;font-size:23px;letter-spacing:-.045em;margin-top:6px;color:#111
}
.execMetric span{display:block;font-size:8px;color:#83888d;margin-top:4px}
.execMetric .up{color:var(--red2)}
.execMetric .down{color:var(--green2)}

.executiveGrid{
  display:grid;
  grid-template-columns:1.15fr .85fr .85fr;
  gap:14px;
  margin-bottom:14px
}
.executiveGrid.two{grid-template-columns:1.15fr .85fr}
.premiumCard{
  background:#fff;
  border:1px solid var(--line2);
  border-radius:15px;
  overflow:hidden
}
.premiumCardHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 17px 0
}
.premiumCardHead h3{
  margin:0;font-size:10px;color:#202327;letter-spacing:-.01em
}
.premiumCardHead small{font-size:7.5px;color:#979ca1}
.premiumCardBody{padding:12px 17px 17px}
.donutWrap{height:250px;position:relative}
.donutCenter{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none
}
.donutCenter div{text-align:center}
.donutCenter small{display:block;font-size:7px;text-transform:uppercase;color:#999;letter-spacing:.07em}
.donutCenter strong{display:block;font-size:20px;margin-top:4px;color:#111}
.miniList{display:grid;gap:9px;margin-top:8px}
.miniLine{
  display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;
  font-size:8px;color:#666
}
.miniDot{width:8px;height:8px;border-radius:50%}
.miniLine b{color:#272a2d;font-size:8px}
.miniLine strong{color:#17191c;font-size:8px}

.attentionList{display:grid;gap:0}
.attentionItem{
  display:grid;
  grid-template-columns:34px 1fr auto;
  gap:10px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #edf0f2;
  cursor:pointer
}
.attentionItem:last-child{border-bottom:0}
.attentionIndex{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:#f1f2f3;color:#333;font-size:8px;font-weight:800
}
.attentionItem b{display:block;font-size:8.5px;color:#222}
.attentionItem p{margin:3px 0 0;font-size:8px;color:#83888d;line-height:1.45}
.attentionItem strong{font-size:9px;color:#222;white-space:nowrap}

.premiumTable{overflow:auto;max-height:450px}
.premiumTable table{width:100%;border-collapse:collapse}
.premiumTable th{
  background:#fafafa;color:#92979c;font-size:7px;text-transform:uppercase;letter-spacing:.06em;
  position:sticky;top:0;z-index:2
}
.premiumTable td{font-size:8.4px}
.premiumTable tr:hover td{background:#fafbfc}

.reportExecutive{
  background:#fff;border:1px solid var(--line2);border-radius:16px;padding:23px 24px;margin-bottom:14px
}
.reportExecutive .tag{
  display:inline-block;font-size:7px;color:#777;text-transform:uppercase;letter-spacing:.14em;font-weight:800
}
.reportExecutive h2{font-size:23px;margin:6px 0;color:#111;letter-spacing:-.04em}
.reportExecutive p{font-size:9.5px;line-height:1.7;color:#666;margin:0;max-width:1050px}
.reportSection{margin:18px 0 8px}
.reportSection h3{font-size:11px;margin:0;color:#202226}
.reportSection span{font-size:7.5px;color:#959aa0}
.reportNarrative{gap:9px}
.reportTextBlock{
  border-radius:10px;
  border:1px solid #e7e9ec;
  background:#fff;
  padding:13px 14px
}
.reportTextBlock h4{font-size:9px}
.reportTextBlock p{font-size:8.8px}
.execConclusion{background:#fff;border:1px solid #e3e5e8}

@media(max-width:1200px){
  .executiveGrid,.executiveGrid.two{grid-template-columns:1fr 1fr}
}
@media(max-width:850px){
  .executiveGrid,.executiveGrid.two{grid-template-columns:1fr}
  .execKpis{grid-template-columns:1fr 1fr}
  .execMetric:nth-child(2){border-right:0}
}

.drillMetric small{display:block;font-size:7px;text-transform:uppercase;color:#888;letter-spacing:.07em;font-weight:800}
.drillMetric strong{display:block;font-size:16px;margin-top:5px;color:#111}
.drillGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.drillTable{max-height:330px;overflow:auto;border:1px solid #e7e9ec;border-radius:9px}
.drillTable table{width:100%;border-collapse:collapse}
.drillTable th{background:#fafafa;color:#888;font-size:7px;text-transform:uppercase;position:sticky;top:0}
.drillTable td{font-size:8px;border-bottom:1px solid #eee;padding:8px}
.drillLink{cursor:pointer}
.drillLink:hover td{background:#f5f6f7}
.drillSection{margin-top:14px}
.drillSection h4{margin:0 0 8px;font-size:9px;color:#222}
.sumHint{font-size:8px;color:#777;align-self:center}

.monthStatus{

.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adminGrid label{display:grid;gap:5px;font-size:7px;color:#777;text-transform:uppercase;font-weight:800}
.adminGrid input,.adminGrid select{border:1px solid #ddd;border-radius:8px;padding:9px;font-size:9px}
.adminActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

function rec(){const m=$('#month').value;state[m]??={forecast:[],actual:[],links:{},catalog:{categories:[],costCenters:[]}};return state[m]}

function rowKey(r){return r.id}
function text(r){return norm([r.party,r.description,r.category,r.costCenter].join(' '))}
function isExcluded(r){return !!r.excluded}
function bankFee(r){const t=text(r);return /\b(TAR|TARIFA|TAXA)\b.*\bPIX\b/.test(t)||/\bPIX\b.*\b(TAR|TARIFA|TAXA)\b/.test(t)||/\bTAR PIX\b/.test(t)}
function salaryAdvance(r){const t=text(r);if(/\b(13|DECIMO TERCEIRO)\b.*\bSALARI/.test(t))return false;if(/\b(BONUS|LUCRO|LUCROS|FORNECEDOR|VIAGEM|COMPRA)\b/.test(t))return false;return /\bADIANTAMENT(?:O|OS)\b.*\bSALARI/.test(t)||(/\bFOPAG\b/.test(t)&&/\bADIANTAMENT/.test(t)&&/\bSALARI/.test(t))}
function vacation(r){return /\bFERIAS\b/.test(text(r))}
function service(r){return /\bPRESTAC(?:AO|OES)\b.*\bSERVIC/.test(text(r))||/\bSERVICOS PRESTADOS\b/.test(text(r))||norm(r.category).includes('PAGAMENTO PRESTACAO DE SERVICO')}
function profitAdvance(r){return /\b(ANTECIPACAO|ADIANTAMENTO)\b.*\bLUCRO/.test(text(r))}
function fopagSalary(r){const t=text(r);if(bankFee(r)||salaryAdvance(r)||vacation(r)||service(r)||profitAdvance(r))return false;return /\bFOPAG\b/.test(t)||/\bFOLHA\b/.test(t)||/\bSALARIO\b/.test(t)||norm(r.category).includes('2.03.001')}

function managementClassification(r){
  const t=text(r),cat=norm(r.category);

  // Benefícios (não confundir Vale Alimentação com refeição operacional)
  if(cat.includes('VALE ALIMENTACAO') || /\bCAJU\b.*\bVA\b/.test(t) || /\bVALE ALIMENTACAO\b/.test(t))
    return {group:'Pessoas e Benefícios',sub:'Vale Alimentação'};
  if(cat.includes('VALE TRANSPORTE') || /\bVALE TRANSPORTE\b/.test(t) || /\bCAJU\b.*\bVT\b/.test(t))
    return {group:'Pessoas e Benefícios',sub:'Vale Transporte'};
  if(cat.includes('PLANO DE SAUDE') || /\bWELLHUB\b|\bCONEXA\b|\bPLANO DE SAUDE\b/.test(t))
    return {group:'Pessoas e Benefícios',sub:'Saúde e Bem-estar'};

  // Alimentação operacional/reunião/viagem, separada dos benefícios
  if(/\b(IFOOD|RESTAURANTE|RESTAURANTES|LANCHONETE|ALMOCO|JANTAR|REFEICAO|PIZZA|SUSHI|PADARIA|CAFE DA MANHA|CAFETERIA)\b/.test(t))
    return {group:'Alimentação',sub:'Refeições e Alimentação'};

  if(paymentType(r)==='salaryAdvance') return {group:'Pessoas e FOPAG',sub:'Adiantamentos Salariais'};
  if(paymentType(r)==='vacation') return {group:'Pessoas e FOPAG',sub:'Férias'};
  if(paymentType(r)==='fopag') return {group:'Pessoas e FOPAG',sub:'Folha / Salários'};
  if(cat.includes('FGTS') || /\bFGTS\b|\bINSS\b/.test(t)) return {group:'Pessoas e FOPAG',sub:'Encargos Trabalhistas'};
  if(cat.includes('COMISSAO') || /\bCOMISSAO\b/.test(t)) return {group:'Pessoas e FOPAG',sub:'Comissões e Premiações'};

  if(cat.includes('ALUGUEL')) return {group:'Ocupação e Estrutura',sub:'Aluguel'};
  if(cat.includes('CONDOMINIO') || cat.includes('IPTU')) return {group:'Ocupação e Estrutura',sub:'Condomínio / IPTU'};
  if(cat.includes('ENERGIA')) return {group:'Ocupação e Estrutura',sub:'Energia'};
  if(cat.includes('AGUA')) return {group:'Ocupação e Estrutura',sub:'Água e Saneamento'};
  if(cat.includes('MANUTENCAO PREDIAL')) return {group:'Ocupação e Estrutura',sub:'Manutenção Predial'};

  if(cat.includes('FACCAO')) return {group:'Produção e Produto',sub:'Facção / Mão de obra'};
  if(cat.includes('TECIDO')) return {group:'Produção e Produto',sub:'Tecidos'};
  if(cat.includes('PRODUTOS PARA REVENDA')) return {group:'Produção e Produto',sub:'Produtos para Revenda'};
  if(cat.includes('ETIQUETA')) return {group:'Produção e Produto',sub:'Etiquetas e Aviamentos'};
  if(/\bAVIAMENTO\b|\bEMBALAGEM\b/.test(t)) return {group:'Produção e Produto',sub:'Aviamentos / Embalagens'};

  if(cat.includes('FRETE')) return {group:'Logística',sub:cat.includes('ENTRADA')?'Frete de Entrada':'Frete de Saída'};
  if(/\bUBER\b|\b99\b|\bTAXI\b|\bTRANSPORTE\b/.test(t)) return {group:'Logística',sub:'Transporte e Mobilidade'};

  if(cat.includes('MARKETING') || cat.includes('SOCIAL MEDIA')) return {group:'Marketing e Comercial',sub:'Marketing / Social Media'};
  if(cat.includes('VITRINE') || /\bVM\b/.test(t)) return {group:'Marketing e Comercial',sub:'Vitrine / VM'};
  if(cat.includes('PREMIAC')) return {group:'Marketing e Comercial',sub:'Premiações'};

  if(cat.includes('ICMS') || cat.includes('SIMPLES') || /\bDARF\b|\bIMPOSTO\b|\bTRIBUTO\b/.test(t)) return {group:'Tributos',sub:'Impostos e Tributos'};

  if(cat.includes('SOFTWARE') || /\bSOFTWARE\b|\bLICENCA\b|\bLINX\b/.test(t)) return {group:'Tecnologia',sub:'Software e Licenças'};
  if(cat.includes('TELEFONIA') || /\bINTERNET\b|\bTELEFONIA\b/.test(t)) return {group:'Tecnologia',sub:'Telefonia e Internet'};

  if(paymentType(r)==='service' || cat.includes('PRESTACAO DE SERVICO')) return {group:'Serviços Profissionais',sub:'Prestação de Serviços'};
  if(cat.includes('ASSESSORIA')) return {group:'Serviços Profissionais',sub:'Assessoria'};
  if(cat.includes('CONSULTORIA')) return {group:'Serviços Profissionais',sub:'Consultoria'};

  if(paymentType(r)==='bankFee' || cat.includes('TARIFA')) return {group:'Financeiro',sub:'Tarifas Bancárias'};
  if(cat.includes('EMPRESTIMO')) return {group:'Financeiro',sub:'Empréstimos'};
  if(paymentType(r)==='profitAdvance') return {group:'Financeiro',sub:'Antecipação de Lucros'};

  return {group:'Outras Despesas',sub:r.category||'Sem subcategoria'};
}
function ensureClassification(r,force=false){
  const c=managementClassification(r);
  if(force || !r.managementGroup) r.managementGroup=c.group;
  if(force || !r.subcategory) r.subcategory=c.sub;
  return r;
}
function migrateState(){
  for(const m of Object.keys(state||{})){
    const R=state[m];
    for(const r of [...(R.forecast||[]),...(R.actual||[])])ensureClassification(r,false);
  }
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}
}
function groupRows(A){
  const m={};
  for(const r of A.f){
    ensureClassification(r);
    const k=r.managementGroup||'Outras Despesas';
    m[k]??={name:k,forecast:0,actual:0,rows:[]};
    m[k].forecast+=r.amount;m[k].rows.push(r);
  }
  for(const r of A.a){
    ensureClassification(r);
    const k=r.managementGroup||'Outras Despesas';
    m[k]??={name:k,forecast:0,actual:0,rows:[]};
    m[k].actual+=r.amount;m[k].rows.push(r);
  }
  return Object.values(m).map(x=>({...x,diff:x.actual-x.forecast,execution:x.forecast?x.actual/x.forecast*100:0})).sort((a,b)=>b.actual-a.actual);
}
function colorPalette(n){
  const c=['#2a9d8f','#457b9d','#e9c46a','#e76f51','#7d5bbe','#43aa8b','#f8961e','#577590','#f94144','#90be6d','#277da1','#f3722c','#4d908e','#b56576'];
  return Array.from({length:n},(_,i)=>c[i%c.length]);

function paymentType(r){
  if(r.manualType && r.manualType!=='automatic')return r.manualType;
  if(bankFee(r))return'bankFee';
  if(salaryAdvance(r))return'salaryAdvance';
  if(vacation(r))return'vacation';
  if(service(r))return'service';
  if(profitAdvance(r))return'profitAdvance';
  if(fopagSalary(r))return'fopag';
  return'other';
}
function tokens(s){return [...new Set(norm(s).split(/[^A-Z0-9]+/).filter(x=>x.length>2 && !['PREVISAO','PAGAMENTO','PARCELA','DANese','LTDA'].includes(x)))].slice(0,20)}
function tokenScore(a,b){const A=tokens(a),B=new Set(tokens(b));if(!A.length)return 0;return A.filter(x=>B.has(x)).length/A.length}
function isGroupedPlan(p){const t=text(p),tp=paymentType(p);return (tp==='salaryAdvance'&&/\bPREVISAO\b/.test(t))||(tp==='fopag'&&/\bPREVISAO\b/.test(t)&&/\bFOPAG\b/.test(t))}
function scoreMatch(a,p){
  let s=0;
  if(paymentType(a)!=='other' && paymentType(a)===paymentType(p))s+=5;
  if(norm(a.category)===norm(p.category))s+=3;
  if(norm(a.costCenter)===norm(p.costCenter))s+=1.5;
  if(norm(a.party)!=='NAO INFORMADO' && norm(a.party)===norm(p.party))s+=5;
  const sim=tokenScore(a.description,p.description);s+=sim*4;
  const av=Number(a.amount||0),pv=Number(p.amount||0),ratio=pv?Math.abs(av-pv)/pv:1;
  if(ratio<.01)s+=4; else if(ratio<.08)s+=2; else if(ratio<.25)s+=.5;
  return s;
}
function reconcile(){
  const r=rec(), forecasts=r.forecast.filter(x=>!isExcluded(x)), actuals=r.actual.filter(x=>!isExcluded(x));
  const links={}, reasons={};
  for(const a of actuals){
    if(r.links?.[a.id] && forecasts.some(p=>p.id===r.links[a.id])){
      links[a.id]=r.links[a.id];reasons[a.id]='Vínculo manual';continue;
    }
    const tp=paymentType(a);
    if(tp==='bankFee'){reasons[a.id]='Tarifa bancária sem previsão vinculada';continue}
    if(tp==='salaryAdvance'||tp==='fopag'){
      const group=forecasts.filter(p=>paymentType(p)===tp&&isGroupedPlan(p));
      if(group.length){links[a.id]=group[0].id;reasons[a.id]='Previsão agrupadora FOPAG';continue}
    }
    let best=null,bestScore=0;
    for(const p of forecasts){
      if(paymentType(p)!==tp && tp!=='other')continue;
      const s=scoreMatch(a,p);
      if(s>bestScore){best=p;bestScore=s}
    }
    if(best && bestScore>=5.4){links[a.id]=best.id;reasons[a.id]='Conciliação automática';}
    else reasons[a.id]='Sem previsão compatível';
  }
  const byForecast={};
  for(const [aid,pid] of Object.entries(links))(byForecast[pid]??=[]).push(aid);
  return {links,reasons,byForecast,forecasts,actuals};
}
function computeAnalytics(){
  const R=reconcile(), f=R.forecasts,a=R.actuals;
  const fTotal=f.reduce((s,x)=>s+x.amount,0),aTotal=a.reduce((s,x)=>s+x.amount,0);
  const unexpected=a.filter(x=>!R.links[x.id]);
  const pending=[], planStatus=[];
  for(const p of f){
    const linked=(R.byForecast[p.id]||[]).map(id=>a.find(x=>x.id===id)).filter(Boolean);
    const paid=linked.reduce((s,x)=>s+x.amount,0),diff=paid-p.amount,remaining=Math.max(p.amount-paid,0);
    planStatus.push({p,linked,paid,diff,remaining});
    if(remaining>.01)pending.push({...p,remaining,paid});
  }
  return {R,f,a,fTotal,aTotal,diff:aTotal-fTotal,unexpected,unexpectedTotal:unexpected.reduce((s,x)=>s+x.amount,0),pending,pendingTotal:pending.reduce((s,x)=>s+x.remaining,0),planStatus};
}
function analytics(){
  const key=($('#month')?.value||'')+'|'+DATA_REV;
  if(analyticsCache.has(key))return analyticsCache.get(key);
  const value=computeAnalytics();
  const O=openCommitmentSummary();
  value.o=O.open;
  value.openTotal=O.total;
  value.openFitted=O.fitted;
  value.openUnmatched=O.unmatched;
  value.openMatches=O.matches;
  value.openUnmatchedRows=O.unmatched;
  analyticsCache.set(key,value);
  return value;
}

  for(const r of A.a){const k=r.category||'Sem categoria';m[k]??={name:k,forecast:0,actual:0,rows:[]};m[k].actual+=r.amount;m[k].rows.push(r)}
  return Object.values(m).map(x=>({...x,diff:x.actual-x.forecast,execution:x.forecast?x.actual/x.forecast*100:0})).sort((x,y)=>y.actual-x.actual)

function fopagData(A){
  const blocks=[
    {name:'Folha / salários',type:'fopag'},
    {name:'Adiantamentos salariais',type:'salaryAdvance'},

function reportNarrative(A,cats,vendors,wk,fop){
  const exec=A.fTotal?A.aTotal/A.fTotal*100:0;
  const accuracy=A.fTotal?Math.max(0,100-Math.abs(A.diff)/A.fTotal*100):0;
  const unpct=A.aTotal?A.unexpectedTotal/A.aTotal*100:0;
  const topOver=[...cats].filter(x=>x.diff>0).sort((a,b)=>b.diff-a.diff);
  const topUnder=[...cats].filter(x=>x.diff<0).sort((a,b)=>a.diff-b.diff);
  const spendGroups=groupRows(A);
  const largestGroup=spendGroups[0];
  const top5pct=0;
  const worstWeek=[...wk].sort((a,b)=>(b.actual-b.forecast)-(a.actual-a.forecast))[0];

  const fopagForecast=fop.reduce((s,b)=>s+b.forecast.reduce((t,x)=>t+x.amount,0),0);
  const fopagActual=fop.reduce((s,b)=>s+b.actual.reduce((t,x)=>t+x.amount,0),0);
  const fopagDiff=fopagActual-fopagForecast;

  let budgetText='';
  if(A.diff>0){
    budgetText=`O mês encerrou com <strong>${money(A.aTotal)}</strong> pagos contra <strong>${money(A.fTotal)}</strong> previstos, gerando um desvio desfavorável de <strong>${money(A.diff)}</strong>. A execução atingiu <strong>${pct(exec)}</strong> do orçamento.`;
    if(topOver.length){
      budgetText+=` A principal pressão veio de <strong>${esc(topOver[0].name)}</strong>, com gasto ${money(topOver[0].diff)} acima do planejado.`;
    }
  }else{
    budgetText=`O mês apresenta <strong>${money(A.aTotal)}</strong> pagos frente a <strong>${money(A.fTotal)}</strong> previstos. O realizado está <strong>${money(Math.abs(A.diff))}</strong> abaixo do orçamento, com execução de <strong>${pct(exec)}</strong>.`;
    if(A.pendingTotal>0){
      budgetText+=` Entretanto, ainda existem <strong>${money(A.pendingTotal)}</strong> em previsões sem pagamento integral, por isso a diferença favorável ainda não deve ser interpretada integralmente como economia.`;
    }
  }

  const predictText = A.unexpectedTotal>0
    ? `Foram identificados <strong>${A.unexpected.length} pagamentos sem previsão vinculada</strong>, totalizando <strong>${money(A.unexpectedTotal)}</strong>, equivalentes a <strong>${pct(unpct)}</strong> do realizado. Esses itens reduzem a previsibilidade do caixa e devem ser classificados entre despesas pontuais, erros de vinculação e gastos que precisam passar a integrar o orçamento dos próximos meses.`
    : `Não foram identificados pagamentos fora da previsão no recorte atual. Isso melhora a previsibilidade do caixa e indica boa aderência entre orçamento e execução.`;

  const pendingText = A.pendingTotal>0
    ? `Existem <strong>${A.pending.length} previsões com saldo ainda não realizado</strong>, somando <strong>${money(A.pendingTotal)}</strong>. Antes do fechamento definitivo, é necessário confirmar se esses valores ainda serão pagos, foram cancelados, mudaram de competência ou precisam ser ajustados no orçamento.`
    : `Não existem previsões relevantes pendentes de pagamento no recorte atual. O fechamento está mais próximo de refletir a posição final da competência.`;

  const supplierText = largestGroup
    ? `O maior grupo gerencial de despesas no período foi <strong>${esc(largestGroup.name)}</strong>, com <strong>${money(largestGroup.actual)}</strong> realizados. A classificação gerencial separa Alimentação, Pessoas/FOPAG, Produção, Logística, Ocupação, Tecnologia, Tributos e demais grupos para tornar a leitura do caixa mais clara.`
    : `Não há dados suficientes para análise da composição dos gastos.`;

  const fopagText = `A FOPAG consolidada apresenta <strong>${money(fopagForecast)}</strong> previstos e <strong>${money(fopagActual)}</strong> pagos, com diferença de <strong>${money(fopagDiff)}</strong>. O controle mantém separados folha/salários, adiantamentos salariais, férias, prestação de serviços e o bloco interno de FOPAG Na Praia. A previsão de “Adiantamentos Salariais Colaboradores” funciona como orçamento agrupador e recebe os pagamentos individuais vinculados a ela.`;

  const weeklyText = worstWeek
    ? `A maior pressão semanal ocorreu na <strong>${esc(worstWeek.label)}</strong>, quando o realizado superou o previsto em <strong>${money(worstWeek.actual-worstWeek.forecast)}</strong>. Essa semana deve ser usada como referência para investigar concentração de vencimentos, antecipações ou pagamentos não previstos.`
    : `Não há dados suficientes para identificar uma semana de maior pressão de caixa.`;

  const conclusion = [];
  if(A.diff>0) conclusion.push(`Revisar as categorias que ultrapassaram o orçamento, começando por ${topOver[0]?.name||'maior desvio identificado'}.`);
  if(A.unexpected.length) conclusion.push(`Justificar e classificar os ${A.unexpected.length} pagamentos não previstos; os recorrentes devem entrar no orçamento futuro.`);
  if(A.pending.length) conclusion.push(`Validar os ${A.pending.length} compromissos previstos ainda pendentes antes de considerar saldo orçamentário como economia.`);
  if(largestGroup) conclusion.push(`Acompanhar ${largestGroup.name}, atualmente o maior grupo gerencial de desembolso da competência.`);
  conclusion.push(`Manter o acompanhamento de FOPAG separado por componente para evitar distorções entre folha, adiantamentos, férias e serviços.`);
  if(accuracy<90) conclusion.push(`A aderência ao planejamento está em ${pct(accuracy)}; é recomendável revisar premissas de orçamento para a próxima competência.`);

  return {budgetText,predictText,pendingText,supplierText,fopagText,weeklyText,conclusion,accuracy,exec,unpct,topOver,topUnder,top5pct};
}

function updateInlineSelection(block){
  if(!block)return;
  const ids=[...block.querySelectorAll('.rowSelect:checked')].map(x=>x.dataset.select);
  const data=rows().filter(r=>ids.includes(r.id));
  const total=data.reduce((s,r)=>s+Number(r.amount||0),0);
  const count=block.querySelector('.inlineSelectionCount');
  const value=block.querySelector('.inlineSelectionValue');
  if(count)count.textContent=`${data.length} lançamento${data.length===1?'':'s'}`;
  if(value)value.textContent=money(total);
  block.classList.toggle('hasSelection',data.length>0);
}
function setSelectionFromBlock(block){
  selectedRows.clear();
  [...block.querySelectorAll('.rowSelect:checked')].forEach(x=>selectedRows.add(x.dataset.select));
}

function bindSelectionControls(){
  document.querySelectorAll('.tableBlock').forEach(block=>updateInlineSelection(block));

  document.querySelectorAll('.rowSelect').forEach(cb=>{
    cb.onclick=e=>{
      e.stopPropagation();
      const block=cb.closest('.tableBlock');
      if(cb.checked)selectedRows.add(cb.dataset.select);else selectedRows.delete(cb.dataset.select);
      cb.closest('tr')?.classList.toggle('selectedRow',cb.checked);
      updateInlineSelection(block);
    };
  });

  document.querySelectorAll('.checkAllVisible').forEach(master=>{

      e.stopPropagation();
      const block=master.closest('.tableBlock');

      boxes.forEach(cb=>{
        cb.checked=master.checked;

        cb.closest('tr')?.classList.toggle('selectedRow',master.checked);
      });
      updateInlineSelection(block);

  document.querySelectorAll('.inlineBulkEdit').forEach(btn=>btn.onclick=e=>{

  document.querySelectorAll('.inlineLink').forEach(btn=>btn.onclick=e=>{

    if(!selectedRows.size)return toast('Selecione pagamentos nesta tabela.');

function openMatchScore(o,p){
  let score=0;
  const O=norm([o.party,o.description,o.category,o.costCenter].join(' '));
  const P=norm([p.party,p.description,p.category,p.costCenter].join(' '));
  if(norm(o.category)&&norm(o.category)===norm(p.category))score+=3;
  if(norm(o.costCenter)&&norm(o.costCenter)===norm(p.costCenter))score+=1.5;
  if(norm(o.party)&&norm(o.party)!=='NAO INFORMADO'&&norm(o.party)===norm(p.party))score+=2.5;

  const ot=norm(o.description).split(' ').filter(x=>x.length>3);
  const pt=new Set(norm(p.description).split(' ').filter(x=>x.length>3));
  let common=0;ot.forEach(x=>pt.has(x)&&common++);
  if(ot.length)score+=Math.min(2.5,common/ot.length*2.5);

  const pa=Math.abs(Number(o.amount)||0),pp=Math.abs(Number(p.amount)||0);
  if(pa&&pp){
    const ratio=Math.abs(pa-pp)/Math.max(pa,pp);
    if(ratio<=.01)score+=2;
    else if(ratio<=.05)score+=1.5;
    else if(ratio<=.15)score+=.8;
  }
  return score;
}
function reconcileOpen(){
  const r=rec(),plans=r.forecast.filter(x=>!x.excluded),opens=(r.open||[]).filter(x=>!x.excluded);
  const matches=[],unmatched=[];
  r.openLinks=r.openLinks||{};

  for(const o of opens){
    let p=null,score=0,manual=false;
    const manualId=r.openLinks[o.id];
    if(manualId){
      p=plans.find(x=>x.id===manualId)||null;
      if(p){score=99;manual=true;}
    }
    if(!p){
      for(const candidate of plans){
        const s=openMatchScore(o,candidate);
        if(s>score){score=s;p=candidate;}
      }
      if(score<4.5)p=null;
    }
    if(p)matches.push({open:o,forecast:p,score,manual});
    else unmatched.push(o);
  }
  return {matches,unmatched};
}
function openCommitmentSummary(){
  const r=rec(),open=(r.open||[]).filter(x=>!x.excluded);
  const reconciled=reconcileOpen();
  const total=open.reduce((s,x)=>s+Number(x.amount||0),0);
  const fitted=reconciled.matches.reduce((s,x)=>s+Number(x.open.amount||0),0);
  const unmatched=reconciled.unmatched.reduce((s,x)=>s+Number(x.amount||0),0);
  return {open,total,fitted,unmatched,...reconciled};
}

function basicCols(){return[
 {label:'Data',render:r=>dateText(r.date)},
 {label:'Fornecedor / colaborador',render:r=>esc(r.party)},
 {label:'Descrição',render:r=>esc(r.description)},
 {label:'Categoria',render:r=>esc(r.category)},
 {label:'Centro de custo',render:r=>esc(r.costCenter)},
 {label:'Valor',num:true,render:r=>`<b>${money(r.amount)}</b>`}
]}
function filteredRows(A){
 const q=norm($('#fq')?.value||''),src=$('#fs')?.value||'all',cat=$('#fc')?.value||'all',grp=$('#fg')?.value||'all';
 return [...A.f,...A.a].filter(r=>{
   ensureClassification(r);
   const search=norm([r.party,r.description,r.category,r.managementGroup,r.subcategory,r.costCenter].join(' '));
   return (src==='all'||r.source===src)&&(cat==='all'||r.category===cat)&&(grp==='all'||r.managementGroup===grp)&&(!q||search.includes(q));
 }).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function filtersHTML(){
 const cats=[...new Set(rows().map(r=>r.category).filter(Boolean))].sort();
 const groups=[...new Set(rows().map(r=>{ensureClassification(r);return r.managementGroup}).filter(Boolean))].sort();
 return `<div class="filterbar noPrint"><input id="fq" placeholder="Buscar fornecedor, descrição, categoria, subcategoria..."><select id="fs"><option value="all">Previsto + pago</option><option value="forecast">Somente previsto</option><option value="actual">Somente pago</option></select><select id="fg"><option value="all">Todos os grupos</option>${groups.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="fc"><option value="all">Todas as categorias</option>${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button id="applyFilters">Aplicar</button><button id="clearFilters">Limpar</button></div>`;
}
function comparisonTable(A){
 return card('Conciliação de previsões',`<div class="tableWrap"><table><thead><tr><th>Previsão</th><th>Categoria</th><th class="num">Previsto</th><th class="num">Pago vinculado</th><th class="num">Saldo / desvio</th><th>Status</th></tr></thead><tbody>${A.planStatus.map(x=>`<tr class="clickrow" data-row="${esc(x.p.id)}"><td><b>${esc(x.p.description)}</b><br><span style="color:var(--muted)">${esc(x.p.party)}</span></td><td>${esc(x.p.category)}</td><td class="num">${money(x.p.amount)}</td><td class="num">${money(x.paid)}</td><td class="num ${x.diff>0?'positive':x.remaining>0?'':'negative'}">${x.diff>0?money(x.diff):money(x.remaining)}</td><td>${x.diff>.01?'<span class="badge risk">Acima</span>':x.remaining>.01?'<span class="badge warn">Pendente</span>':'<span class="badge good">Conciliado</span>'}</td></tr>`).join('')}</tbody></table></div>`,'Uma previsão pode receber vários pagamentos');

function aggregateBy(list,keyFn){
  const m={};
  for(const r of list){
    ensureClassification(r);
    const k=keyFn(r)||'Não informado';
    m[k]??={name:k,forecast:0,actual:0,count:0,rows:[]};
    if(r.source==='forecast')m[k].forecast+=r.amount;else m[k].actual+=r.amount;
    m[k].count++;m[k].rows.push(r);
  }
  return Object.values(m).map(x=>({...x,diff:x.actual-x.forecast})).sort((a,b)=>Math.max(b.actual,b.forecast)-Math.max(a.actual,a.forecast));
}

function openWeekDrill(week){
  const A=analytics();
  const f=A.f.filter(r=>weekOf(r.date)==week),a=A.a.filter(r=>weekOf(r.date)==week);
  const unexpected=A.unexpected.filter(r=>weekOf(r.date)==week);
  const forecastTotal=f.reduce((s,r)=>s+r.amount,0),actualTotal=a.reduce((s,r)=>s+r.amount,0);
  const diff=actualTotal-forecastTotal;
  const execution=forecastTotal?actualTotal/forecastTotal*100:0;
  const pending=A.pending.filter(r=>weekOf(r.date)==week);
  const pendingTotal=pending.reduce((s,r)=>s+(r.remaining||0),0);
  const cats=aggregateBy([...f,...a],r=>r.category);

  $('#modalTitle').textContent=`Semana ${week} · Previsto x Realizado`;
  $('#modalSub').textContent='Clique em uma categoria para abrir as subcategorias e os lançamentos da própria semana.';

      <div class="drillMetric"><small>Previsto</small><strong>${money(forecastTotal)}</strong></div>
      <div class="drillMetric"><small>Realizado</small><strong>${money(actualTotal)}</strong></div>
      <div class="drillMetric"><small>Diferença</small><strong>${money(diff)}</strong></div>
      <div class="drillMetric"><small>Execução</small><strong>${pct(execution)}</strong></div>

  $('#modal').classList.add('open');

  $$('[data-week-cat-index]').forEach(el=>el.onclick=()=>{

 $('#addCC').onclick=()=>{const v=$('#newCC').value.trim();if(!v)return;rec().catalog??={categories:[],costCenters:[]};rec().catalog.costCenters=[...new Set([...(rec().catalog.costCenters||[]),v])];saveState('Centro de custo criado.');openCatalog()};
 $$('[data-ren-cat]').forEach(b=>b.onclick=()=>{const old=b.dataset.renCat,n=prompt('Novo nome:',old);if(!n||n===old)return;rows().forEach(r=>{if(r.category===old)r.category=n});rec().catalog.categories=[...new Set((rec().catalog.categories||[]).filter(x=>x!==old).concat(n))];saveState('Categoria renomeada em todos os lançamentos.');openCatalog()});

function toast(msg){$('#footer').textContent=msg+' · '+new Date().toLocaleTimeString('pt-BR')}

function emptyMonthRecord(){
  return {forecast:[],actual:[],open:[],links:{},openLinks:{},catalog:{categories:[],costCenters:[]},auditLog:[],updatedAt:null,closedAt:null};
}
function normalizeMonthRecord(r){
  const out={...emptyMonthRecord(),...(r||{})};
  out.forecast=Array.isArray(out.forecast)?out.forecast:[];
  out.actual=Array.isArray(out.actual)?out.actual:[];
  out.links=out.links||{};
  out.catalog=out.catalog||{categories:[],costCenters:[]};
  out.catalog.categories=Array.isArray(out.catalog.categories)?out.catalog.categories:[];
  out.catalog.costCenters=Array.isArray(out.catalog.costCenters)?out.catalog.costCenters:[];
  out.auditLog=Array.isArray(out.auditLog)?out.auditLog:[];
  return out;
}
function renderMonthHistory(){
  const box=$('#monthHistory');if(!box)return;
  const current=$('#month')?.value;
  const months=Object.keys(state).filter(m=>/^\d{4}-\d{2}$/.test(m)).sort().reverse();
  box.innerHTML=`<div class="monthHistory noPrint"><b>Histórico:</b>${months.map(m=>`<button class="monthPill ${m===current?'active':''}" data-month-pill="${m}">${esc(monthText(m))}</button>`).join('')}</div>`;
  $$('[data-month-pill]').forEach(b=>b.onclick=()=>{$('#month').value=b.dataset.monthPill;selectedRows.clear();render()});
}
async function loadHistoricalMonthsFromSupabase(){
  if(!db)return;
  try{
    const {data,error}=await db.from('financial_months').select('competence,forecast,actual,metadata,updated_at').order('competence',{ascending:false});
    if(error)throw error;
    if(!Array.isArray(data))return;
    let changed=false;
    for(const row of data){
      const m=String(row.competence||'').slice(0,7);
      if(!/^\d{4}-\d{2}$/.test(m))continue;
      {
        const meta=row.metadata||{};
        const local=state[m];
        const remoteUpdated=row.updated_at?new Date(row.updated_at).getTime():0;
        const localUpdated=local?.updatedAt?new Date(local.updatedAt).getTime():0;
        if(!local || remoteUpdated>=localUpdated)state[m]=normalizeMonthRecord({
          forecast:row.forecast||[],
          actual:row.actual||[],
          open:row.open||[],
          links:meta.links||{},
          openLinks:meta.openLinks||{},
          catalog:meta.catalog||{categories:[],costCenters:[]},
          auditLog:meta.auditLog||[],
          updatedAt:row.updated_at||null,
          closedAt:meta.closedAt||null
        });
        changed=true;
      }
    }
    if(changed){
      invalidateAnalytics();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      populateMonths($('#month')?.value);
      render();
    }
  }catch(e){console.warn('Histórico Supabase:',e)}
}

function populateMonths(preferredMonth=null){
 const select=$('#month');
 const current=preferredMonth||select.value;
 const months=Object.keys(state).filter(m=>/^\d{4}-\d{2}$/.test(m)).sort().reverse();
 select.innerHTML=months.map(m=>`<option value="${m}">${monthText(m)}</option>`).join('');
 select.value=(current&&months.includes(current))?current:(months[0]||'2026-08');
}
async function importWorkbook(file,source){
 const data=await file.arrayBuffer(),wb=XLSX.read(data),sheet=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(sheet,{defval:''});
 const out=[];
 for(let i=0;i<raw.length;i++){
  const o=raw[i],pick=(names)=>{for(const n of names){const k=Object.keys(o).find(k=>norm(k)===norm(n));if(k)return o[k]}return''};
  let amount=source==='forecast'?num(pick(['Valor original da parcela (R$)','Valor original','Valor previsto','Valor'])):num(pick(['Valor pago da parcela (R$)','Valor total pago da parcela (R$)','Valor pago','Valor realizado']));
  const status=String(pick(['Situação','Status']));
  if(source==='actual' && (amount<=0||!/\b(QUITADO|PAGO|LIQUIDADO|BAIXADO|CONCILIADO)\b/.test(norm(status))))continue;
  if(amount<=0)continue;
  const rawDate=source==='forecast'?pick(['Data prevista','Data de vencimento','Data de competência']):pick(['Data do último pagamento','Data de pagamento','Data prevista','Data de vencimento']);
  let date='';if(typeof rawDate==='number'){const d=XLSX.SSF.parse_date_code(rawDate);date=`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}else{const m=String(rawDate).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);date=m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:String(rawDate).slice(0,10)}
  const category=String(pick(source==='forecast'?['Categoria ','Categoria','Categoria 1']:['Categoria 1','Categoria','Plano de contas']))||'Sem categoria';
  const costCenter=String(pick(source==='forecast'?['Centro de Custo ','Centro de Custo','Centro de Custo 1']:['Centro de Custo 1','Centro de Custo','Centro de custo']))||'Não informado';
  const rr={id:uid(source==='forecast'?'F':'A'),source,date,party:String(pick(['Nome do fornecedor','Fornecedor','Fornecedor / Cliente','Pessoa']))||'Não informado',description:String(pick(['Descrição','Descricao','Histórico','Historico','Observação']))||'Sem descrição',amount,category,costCenter,status:source==='forecast'?'Previsto':status,paymentMethod:String(pick(['Forma de pagamento']))||'',bank:String(pick(['Conta bancária']))||'',excluded:false,manualType:'automatic',createdBy:file.name};ensureClassification(rr,false);out.push(rr)
 }
 const grouped={};out.forEach(r=>{const m=r.date.slice(0,7);if(/^\d{4}-\d{2}$/.test(m))(grouped[m]??=[]).push(r)});
 const importedMonths=Object.keys(grouped).sort();
 if(!importedMonths.length){toast('Nenhuma competência válida encontrada no arquivo.');return;}
 pushUndo(source==='forecast'?'importar previsão mensal':'importar pagamentos mensais');
 for(const [m,list] of Object.entries(grouped)){
   state[m]=normalizeMonthRecord(state[m]);
   const field=source==='forecast'?'forecast':'actual';
   state[m][field]=list;
   state[m].updatedAt=new Date().toISOString();
   if(source==='actual'){
     const validIds=new Set(list.map(x=>x.id));
     const kept={};
     for(const [aid,pid] of Object.entries(state[m].links||{}))if(validIds.has(aid))kept[aid]=pid;
     state[m].links=kept;
   }
   state[m].auditLog??=[];
   state[m].auditLog.unshift({at:new Date().toISOString(),action:'Importação mensal',details:`${source==='forecast'?'Previsão':'Pagamentos'} importados em ${m} sem apagar outras competências.`});
 }
 invalidateAnalytics();localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
 const targetMonth=importedMonths[importedMonths.length-1];
 populateMonths(targetMonth);$('#month').value=targetMonth;selectedRows.clear();render();
 toast(`${source==='forecast'?'Previsão':'Pagamentos'} de ${monthText(targetMonth)} importados. Meses anteriores preservados.`);
}
async function saveSupabase(){
 if(!db)return toast('Supabase não configurado.');
 try{
   const {data:{session:s}}=await db.auth.getSession();session=s;
   if(!session){const email=prompt('E-mail do administrador:');const password=prompt('Senha:');if(!email||!password)return;const res=await db.auth.signInWithPassword({email,password});if(res.error)throw res.error;session=res.data.session}
   const m=$('#month').value,r=rec();
   const payload={competence:m,forecast:r.forecast,actual:r.actual,metadata:{links:r.links||{},
        openLinks:r.openLinks||{},catalog:r.catalog||{},auditLog:r.auditLog||[],dashboard_version:'premium-merge-v10'},updated_at:new Date().toISOString(),updated_by:session.user.id};
   const {error}=await db.from('financial_months').upsert(payload,{onConflict:'competence'});if(error)throw error;toast('Competência salva no Supabase.');
 }catch(e){toast('Erro Supabase: '+e.message)}
}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='previsto-realizado-danese.json';a.click();URL.revokeObjectURL(a.href)}
$$('#nav button[data-view]').forEach(b=>b.onclick=()=>{

$('#forecastFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{await importWorkbook(file,'forecast')}catch(err){console.error(err);toast('Erro ao importar previsto: '+err.message)}finally{e.target.value=''}};

$('#undoBtn').onclick=undoLast; $('#adminBtn')?.addEventListener('click',openAdminPanel);$('#auditBtn').onclick=openAuditLog;populateMonths();render();setTimeout(loadHistoricalMonthsFromSupabase,250);
